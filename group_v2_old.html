<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>小组积分 V2</title>
<style>
:root{
  --bg:#f5f6fa;--card:#fff;--text:#1a1a2e;--text-soft:#8b8b9e;
  --line:#e8e8f0;--accent:#6366f1;--accent-light:#eef2ff;
  --green:#10b981;--red:#ef4444;--orange:#f59e0b;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;padding-bottom:70px;min-height:100vh;overscroll-behavior-y:none}

/* 顶部 */
.topbar{position:sticky;top:0;z-index:100;background:var(--card);padding:12px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.topbar-row{display:flex;align-items:center;justify-content:space-between}
.topbar-title{font-size:17px;font-weight:700}
.topbar-badge{font-size:10px;background:var(--accent);color:#fff;padding:2px 6px;border-radius:4px;font-weight:500;margin-left:6px;vertical-align:middle}
.topbar-user{font-size:12px;color:var(--text-soft)}
.week-nav{display:flex;align-items:center;gap:8px;margin-top:10px}
.week-btn{width:36px;height:36px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--text);flex:none}
.week-label{flex:1;text-align:center;font-size:13px;font-weight:600;padding:8px;background:var(--bg);border-radius:10px}
.refresh-btn{width:36px;height:36px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;flex:none}

/* 内容 */
.content{padding:12px}
.view{display:none}
.view.active{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 卡片 */
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-title{font-size:14px;font-weight:700;margin-bottom:12px}

/* 统计概览 */
.stats-row{display:flex;gap:8px;margin-bottom:12px}
.stat-item{flex:1;background:var(--card);border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-num{font-size:22px;font-weight:800;line-height:1.2}
.stat-num.green{color:var(--green)}
.stat-label{font-size:10px;color:var(--text-soft);margin-top:4px}

/* 排名卡片 */
.rank-card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer;transition:transform .1s}
.rank-card:active{transform:scale(.98)}
.rank-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rank-left{display:flex;align-items:center;flex:1;min-width:0}
.rank-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex:none}
.rank-num.r1{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.rank-num.r2{background:linear-gradient(135deg,#94a3b8,#64748b)}
.rank-num.r3{background:linear-gradient(135deg,#fb923c,#ea580c)}
.rank-num.rn{background:var(--line);color:var(--text-soft)}
.rank-name{font-size:17px;font-weight:700;margin-left:12px}
.rank-score{font-size:22px;font-weight:800}
.rank-score.positive{color:var(--green)}
.rank-score.negative{color:var(--red)}
.rank-members{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.rank-member{font-size:11px;background:var(--bg);padding:4px 9px;border-radius:6px;color:var(--text-soft)}

/* 学生列表 */
.stu-row{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.stu-row:last-child{border-bottom:none}
.stu-info{flex:1;min-width:0}
.stu-name{font-size:15px;font-weight:600}
.stu-meta{font-size:11px;color:var(--text-soft);margin-top:3px}
.stu-score{font-size:19px;font-weight:700;margin-right:10px;min-width:55px;text-align:right}
.stu-score.positive{color:var(--green)}
.stu-score.negative{color:var(--red)}
.stu-arrow{color:var(--text-soft);font-size:18px}

/* 分类tab */
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.cat-tab{padding:7px 14px;border-radius:18px;background:var(--bg);font-size:12px;white-space:nowrap;cursor:pointer;color:var(--text-soft);flex:none}
.cat-tab.active{background:var(--accent);color:#fff;font-weight:600}

/* 记录项 */
.rec-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--bg);border-radius:12px;margin-bottom:6px}
.rec-item:last-child{margin-bottom:0}
.rec-info{flex:1;min-width:0}
.rec-label{font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px}
.rec-dot{width:8px;height:8px;border-radius:50%;flex:none}
.rec-by{font-size:11px;color:var(--text-soft);margin-top:3px}
.rec-val{font-size:16px;font-weight:700;margin-right:8px}
.rec-val.positive{color:var(--green)}
.rec-val.negative{color:var(--red)}

/* 日期分组 */
.date-group{font-size:12px;color:var(--text-soft);margin:14px 0 8px;font-weight:600;padding-left:2px}

/* 底部tab */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;box-shadow:0 -2px 10px rgba(0,0,0,.06);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px;cursor:pointer;color:var(--text-soft)}
.tab-item.active{color:var(--accent)}
.tab-item .ico{font-size:22px;margin-bottom:3px}
.tab-item .txt{font-size:10px;font-weight:500}

/* 弹窗 */
.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-mask.show{display:flex}
.modal{background:var(--card);width:100%;max-width:500px;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:17px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-soft);cursor:pointer}

/* 开关 */
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.switch-row:last-child{border-bottom:none}
.switch-title{font-size:14px;font-weight:500}
.switch-sub{font-size:11px;color:var(--text-soft);margin-top:3px}
.switch{width:50px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch.on{background:var(--green)}
.switch-knob{width:24px;height:24px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on .switch-knob{transform:translateX(22px)}

/* Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.loading{text-align:center;padding:40px;color:var(--text-soft);font-size:14px}
.empty{text-align:center;padding:30px;color:var(--text-soft);font-size:13px}

/* 滑块 */
.weight-slider{width:100%;height:6px;-webkit-appearance:none;background:var(--line);border-radius:3px;outline:none;margin:20px 0 8px}
.weight-slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 2px 8px rgba(99,102,241,.3);border:3px solid #fff}
.weight-marks{display:flex;justify-content:space-between;font-size:11px;color:var(--text-soft)}
.btn-primary{width:100%;padding:15px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px}
.btn-secondary{width:100%;padding:15px;background:var(--bg);color:var(--text);border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="topbar-title">小组积分<span class="topbar-badge">V2</span></div>
    <div class="topbar-user" id="userInfo"></div>
  </div>
  <div class="week-nav">
    <div class="week-btn" onclick="shiftWeek(-1)">‹</div>
    <div class="week-label" id="weekLabel">本周</div>
    <div class="week-btn" onclick="shiftWeek(1)">›</div>
    <div class="refresh-btn" onclick="refresh()">🔄</div>
  </div>
</div>

<div class="content">
  <div class="view active" id="view-rank">
    <div class="stats-row">
      <div class="stat-item"><div class="stat-num" id="totalAll">0</div><div class="stat-label">全班总分</div></div>
      <div class="stat-item"><div class="stat-num" id="avgAll">0</div><div class="stat-label">组均</div></div>
      <div class="stat-item"><div class="stat-num green" id="topGrp">-</div><div class="stat-label">第一名</div></div>
    </div>
    <div id="rankList"></div>
  </div>

  <div class="view" id="view-detail">
    <div class="cat-tabs" id="groupTabs"></div>
    <div id="detailList"></div>
  </div>

  <div class="view" id="view-base">
    <div class="card">
      <div class="card-title">📅 每日基础分</div>
      <div id="baseList"></div>
    </div>
    <div class="card">
      <div class="card-title">⚖️ 加权系数（全班统一）</div>
      <div style="text-align:center;font-size:32px;font-weight:800;color:var(--accent)" id="weightShow">×1.00</div>
      <input type="range" class="weight-slider" id="weightSlider" min="1" max="1.12" step="0.01" value="1">
      <div class="weight-marks"><span>×1.00</span><span>×1.06</span><span>×1.12</span></div>
      <button class="btn-primary" onclick="saveWeight()">保存系数</button>
    </div>
  </div>

  <div class="view" id="view-me">
    <div class="card">
      <div style="padding:8px 0">
        <div style="font-size:17px;font-weight:700" id="meName"></div>
        <div style="font-size:12px;color:var(--text-soft);margin-top:4px" id="meRole"></div>
      </div>
    </div>
    <div class="card">
      <div class="switch-row" onclick="exportData()" style="cursor:pointer">
        <div><div class="switch-title">📤 导出全部数据</div><div class="switch-sub">下载所有小组JSON备份</div></div>
        <div style="color:var(--text-soft)">›</div>
      </div>
    </div>
    <div class="card"><button class="btn-secondary" onclick="logout()">退出登录</button></div>
  </div>
</div>

<div class="tabbar">
  <div class="tab-item active" data-view="rank" onclick="switchView('rank')"><span class="ico">🏆</span><span class="txt">排名</span></div>
  <div class="tab-item" data-view="detail" onclick="switchView('detail')"><span class="ico">📋</span><span class="txt">明细</span></div>
  <div class="tab-item" data-view="base" onclick="switchView('base')"><span class="ico">📅</span><span class="txt">基础分</span></div>
  <div class="tab-item" data-view="me" onclick="switchView('me')"><span class="ico">👤</span><span class="txt">我的</span></div>
</div>

<div class="modal-mask" id="stuModal" onclick="if(event.target===this)closeStuModal()">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="stuModalTitle">学生详情</div>
      <div class="modal-close" onclick="closeStuModal()">✕</div>
    </div>
    <div class="stats-row">
      <div class="stat-item"><div class="stat-num" id="stuWeekScore">0</div><div class="stat-label">本周总分</div></div>
      <div class="stat-item"><div class="stat-num" id="stuTodayScore">0</div><div class="stat-label">今日</div></div>
    </div>
    <div class="cat-tabs" id="stuCatTabs"></div>
    <div id="stuRecordList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://zaeijgfuykhkabteqljw.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphZWlqZ2Z1eWtoa2FidGVxbGp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1ODA5MzgsImV4cCI6MjEwNDE1NjkzOH0.CQ-jqsslzaWpeeXg0OJnQsaW-iMNoCKbJGW_-p1F3D8';
const SESSION_KEY='jfz_session_v1';
const sb=supabase.createClient(SB_URL,SB_KEY);
let user=null, accessToken='';
let view='rank', weekOff=0;
let groups={}, curGrp=0, curStu=null, curCat='all';
let realtimeCh=[];
const CATS=[
  {id:'all',name:'全部'},{id:'hw',name:'作业'},{id:'class',name:'课堂'},{id:'eye',name:'眼操'},
  {id:'week',name:'周反馈'},{id:'pass',name:'过关'},{id:'good',name:'好人好事'},{id:'late',name:'迟到'},
  {id:'notes',name:'笔记'},{id:'study',name:'自习'},{id:'break',name:'课间'},{id:'duty',name:'值日'},
  {id:'exercise',name:'课间操'},{id:'appearance',name:'仪容'}
];
const CAT_C={hw:'#3b82f6',class:'#8b5cf6',eye:'#10b981',week:'#f59e0b',pass:'#ec4899',good:'#14b8a6',late:'#ef4444',notes:'#6366f1',study:'#a855f7',break:'#f97316',duty:'#84cc16',exercise:'#06b6d4',appearance:'#d946ef'};
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return fmt(new Date());}
function addD(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function getMon(off){const n=new Date();const day=(n.getDay()+6)%7;const m=addD(n,-day+off*7);m.setHours(0,0,0,0);return m;}
function isWork(d){const w=d.getDay();return w>=1&&w<=5;}
function esc(s){return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function hdrs(){return {'apikey':SB_KEY,'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'};}
async function init(){
  try{user=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');}catch(e){user=null;}
  if(!user||user.role!=='admin'){location.href='index.html';return;}
  document.getElementById('userInfo').textContent=user.name||'';
  document.getElementById('meName').textContent=user.name||'';
  document.getElementById('meRole').textContent='管理员';
  const {data:sd}=await sb.auth.getSession();
  if(!sd||!sd.session){location.href='index.html';return;}
  accessToken=sd.session.access_token;
  await loadAll();renderAll();startRT();
}
async function loadAll(){
  const r=await fetch(SB_URL+'/rest/v1/group_data?select=*&order=group_id',{headers:hdrs()});
  const rows=await r.json();
  groups={};
  for(const row of rows)groups[String(row.group_id)]=row.data||{};
}
async function refresh(){await loadAll();renderAll();toast('已刷新');}
function gd(g){return groups[String(g)]||{};}
function stu(g){return gd(g).students||[];}
function wt(g){return gd(g).weightFactor||1;}
function isOff(g,d){return !!(gd(g).baseOff&&gd(g).baseOff[d]);}
function cellV(g,s,cat,d){
  const dd=gd(g).scores||{};const day=dd[d]||{};const sday=day[s]||{};const ev=sday[cat]||[];
  return ev.reduce((a,e)=>a+(+e.v||0),0);
}
function dayScore(g,s,d){
  if(!isWork(new Date(d)))return 0;
  let total=isOff(g,d)?0:10;
  const items=gd(g).items||[];
  for(const it of items)total+=cellV(g,s,it.id,d);
  return Math.round(total*wt(g)*100)/100;
}
function weekScore(g,s,mon){
  let t=0;for(let i=0;i<7;i++){const d=addD(mon,i);if(isWork(d))t+=dayScore(g,s,fmt(d));}
  return Math.round(t*100)/100;
}
function grpTotal(g,mon){let t=0;for(const s of stu(g))t+=weekScore(g,s.id,mon);return Math.round(t*100)/100;}
function renderRank(){
  const mon=getMon(weekOff);const end=addD(mon,4);
  document.getElementById('weekLabel').textContent=fmt(mon).slice(5)+' ~ '+fmt(end).slice(5);
  const arr=[];let all=0;
  for(let g=1;g<=10;g++){const s=grpTotal(g,mon);arr.push({g,s});all+=s;}
  arr.sort((a,b)=>b.s-a.s);
  document.getElementById('totalAll').textContent=Math.round(all);
  document.getElementById('avgAll').textContent=(all/10).toFixed(1);
  document.getElementById('topGrp').textContent=arr[0]?('第'+arr[0].g+'组'):'-';
  let html='';
  for(let i=0;i<arr.length;i++){
    const {g,s}=arr[i];const sList=stu(g);
    const rc=i===0?'r1':i===1?'r2':i===2?'r3':'rn';
    html+='<div class="rank-card" onclick="openDetail('+g+')">';
    html+='<div class="rank-top">';
    html+='<div class="rank-left"><div class="rank-num '+rc+'">'+(i+1)+'</div><div class="rank-name">第'+g+'组</div></div>';
    html+='<div class="rank-score '+(s>=0?'positive':'negative')+'">'+(s>0?'+':'')+s+'</div>';
    html+='</div><div class="rank-members">';
    for(const s2 of sList.slice(0,5))html+='<span class="rank-member">'+esc(s2.name)+'</span>';
    if(sList.length>5)html+='<span class="rank-member">+'+(sList.length-5)+'</span>';
    html+='</div></div>';
  }
  document.getElementById('rankList').innerHTML=html;
}
function shiftWeek(n){weekOff+=n;renderAll();}
function renderGrpTabs(){
  let html='<div class="cat-tab'+(curGrp===0?' active':'')+'" onclick="pickGrp(0)">全部</div>';
  for(let g=1;g<=10;g++)html+='<div class="cat-tab'+(curGrp===g?' active':'')+'" onclick="pickGrp('+g+')">第'+g+'组</div>';
  document.getElementById('groupTabs').innerHTML=html;
}
function pickGrp(g){curGrp=g;renderGrpTabs();renderDetail();}
function openDetail(g){curGrp=g;switchView('detail');}
function renderDetail(){
  const mon=getMon(weekOff);
  const gs=curGrp===0?Array.from({length:10},(_,i)=>i+1):[curGrp];
  let html='';
  for(const g of gs){
    const sList=stu(g);if(!sList.length)continue;
    html+='<div class="card"><div class="card-title">第'+g+'组 <span style="font-size:11px;color:var(--text-soft);font-weight:400">'+sList.length+'人</span></div>';
    for(const s of sList){
      const ws=weekScore(g,s.id,mon);const ds=dayScore(g,s.id,today());
      html+='<div class="stu-row" onclick="openStu('+g+',\''+s.id+'\')">';
      html+='<div class="stu-info"><div class="stu-name">'+esc(s.name)+'</div><div class="stu-meta">今日 '+(ds>0?'+':'')+ds+'</div></div>';
      html+='<div class="stu-score '+(ws>=0?'positive':'negative')+'">'+(ws>0?'+':'')+ws+'</div>';
      html+='<div class="stu-arrow">›</div></div>';
    }
    html+='</div>';
  }
  document.getElementById('detailList').innerHTML=html||'<div class="empty">暂无数据</div>';
}
function openStu(g,sid){
  const mon=getMon(weekOff);const sList=stu(g);const s=sList.find(x=>x.id===sid);
  if(!s)return;curStu={g,sid,name:s.name};curCat='all';
  document.getElementById('stuModalTitle').textContent=s.name;
  document.getElementById('stuWeekScore').textContent=(weekScore(g,sid,mon)>0?'+':'')+weekScore(g,sid,mon);
  document.getElementById('stuTodayScore').textContent=(dayScore(g,sid,today())>0?'+':'')+dayScore(g,sid,today());
  renderStuCats();renderStuRecs();
  document.getElementById('stuModal').classList.add('show');
}
function renderStuCats(){
  let html='';
  for(const c of CATS)html+='<div class="cat-tab'+(curCat===c.id?' active':'')+'" onclick="pickCat(\''+c.id+'\')">'+c.name+'</div>';
  document.getElementById('stuCatTabs').innerHTML=html;
}
function pickCat(c){curCat=c;renderStuCats();renderStuRecs();}
function renderStuRecs(){
  if(!curStu)return;const {g,sid}=curStu;const mon=getMon(weekOff);
  const cats=curCat==='all'?CATS.filter(c=>c.id!=='all').map(c=>c.id):[curCat];
  let html='';
  for(let i=0;i<7;i++){
    const d=addD(mon,i);if(!isWork(d))continue;const ds=fmt(d);
    let recs=[];const dd=gd(g).scores||{};const dayD=dd[ds]||{};const sday=dayD[sid]||{};
    for(const cat of cats)for(const e of (sday[cat]||[]))recs.push({...e,cat});
    if(!recs.length)continue;
    html+='<div class="date-group">'+ds.slice(5)+'</div>';
    for(const r of recs){
      const ci=CATS.find(c=>c.id===r.cat);const col=CAT_C[r.cat]||'#999';
      html+='<div class="rec-item"><div class="rec-info">';
      html+='<div class="rec-label"><span class="rec-dot" style="background:'+col+'"></span>'+esc(r.label||ci?.name||'自定义')+'</div>';
      html+='<div class="rec-by">'+esc(r.by||'')+' · '+esc(ci?.name||'')+'</div>';
      html+='</div><div class="rec-val '+(r.v>0?'positive':'negative')+'">'+(r.v>0?'+':'')+r.v+'</div></div>';
    }
  }
  document.getElementById('stuRecordList').innerHTML=html||'<div class="empty">本周暂无记录</div>';
}
function closeStuModal(){document.getElementById('stuModal').classList.remove('show');curStu=null;}
function renderBase(){
  const mon=getMon(weekOff);let html='';const names=['周一','周二','周三','周四','周五'];
  for(let i=0;i<5;i++){
    const d=addD(mon,i);const ds=fmt(d);
    let allOff=true,anyOff=false;
    for(let g=1;g<=10;g++){if(isOff(g,ds))anyOff=true;else allOff=false;}
    html+='<div class="switch-row"><div><div class="switch-title">'+ds.slice(5)+' '+names[i]+'</div>';
    html+='<div class="switch-sub">'+(allOff?'已关闭':anyOff?'部分关闭':'基础分+10')+'</div></div>';
    html+='<div class="switch '+(allOff?'on':'')+'" onclick="toggleBase(\''+ds+'\','+allOff+')"><div class="switch-knob"></div></div></div>';
  }
  document.getElementById('baseList').innerHTML=html;
  const w=wt(1);
  document.getElementById('weightShow').textContent='×'+w.toFixed(2);
  document.getElementById('weightSlider').value=w;
}
async function toggleBase(date,currentlyOff){
  for(let g=1;g<=10;g++){
    try{
      const r=await fetch(SB_URL+'/rest/v1/group_data?group_id=eq.'+g+'&select=data',{headers:hdrs()});
      const rows=await r.json();if(!rows||!rows.length)continue;
      const gd2=rows[0].data;if(!gd2.baseOff)gd2.baseOff={};
      if(currentlyOff)delete gd2.baseOff[date];else gd2.baseOff[date]=true;
      gd2.lastModified=Date.now();
      await fetch(SB_URL+'/rest/v1/group_data?group_id=eq.'+g,{method:'PATCH',headers:hdrs(),body:JSON.stringify({data:gd2})});
    }catch(e){console.log(e);}
  }
  await loadAll();renderBase();toast(currentlyOff?'已开启基础分':'已关闭基础分');
}
async function saveWeight(){
  const w=parseFloat(document.getElementById('weightSlider').value);
  document.getElementById('weightShow').textContent='×'+w.toFixed(2);
  for(let g=1;g<=10;g++){
    try{
      const r=await fetch(SB_URL+'/rest/v1/group_data?group_id=eq.'+g+'&select=data',{headers:hdrs()});
      const rows=await r.json();if(!rows||!rows.length)continue;
      const gd2=rows[0].data;gd2.weightFactor=w;gd2.lastModified=Date.now();
      await fetch(SB_URL+'/rest/v1/group_data?group_id=eq.'+g,{method:'PATCH',headers:hdrs(),body:JSON.stringify({data:gd2})});
    }catch(e){console.log(e);}
  }
  await loadAll();renderAll();toast('已保存系数 ×'+w.toFixed(2));
}
function exportData(){
  const data={exportTime:new Date().toISOString(),groups};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='积分V2备份_'+today()+'.json';a.click();toast('已导出');
}
function logout(){sb.auth.signOut();localStorage.removeItem(SESSION_KEY);location.href='index.html';}
function switchView(v){
  view=v;document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(e=>e.classList.remove('active'));
  document.querySelector('.tab-item[data-view="'+v+'"]').classList.add('active');
  renderAll();
}
function renderAll(){
  if(view==='rank')renderRank();
  else if(view==='detail'){renderGrpTabs();renderDetail();}
  else if(view==='base')renderBase();
}
function startRT(){
  for(let g=1;g<=10;g++){
    const ch=sb.channel('gv2_'+g)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'group_data',filter:'group_id=eq.'+g},()=>{
        clearTimeout(window._gv2rt);
        window._gv2rt=setTimeout(async()=>{await loadAll();renderAll();},400);
      })
      .subscribe();
    realtimeCh.push(ch);
  }
}
init();
</script>
