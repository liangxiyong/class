<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班级积分</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
<style>
:root{
  --paper:#f6f1e8;--card:#fffdf9;--ink:#2b2420;--ink-soft:#7a6d61;--line:#e3d9c9;
  --accent:#c0392b;--accent-soft:#f6e3df;--green:#2e7d32;--red:#c62828;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;color:inherit;outline:none}
.app{display:flex;height:100vh}
.sidebar{
  width:210px;background:linear-gradient(180deg,#3a2f28,#2b2420);color:#f7f1e6;
  display:flex;flex-direction:column;padding:22px 14px;flex-shrink:0;
}
.brand{font-size:17px;font-weight:800;padding:4px 10px 16px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:8px}
.brand .ico{font-size:20px}
.sidebar-user{font-size:11.5px;color:rgba(247,241,230,.6);padding:12px 10px 4px}
.nav{flex:1;margin-top:10px}
.nav-item{padding:10px 12px;border-radius:9px;font-size:13.5px;cursor:pointer;color:rgba(247,241,230,.82);margin-bottom:3px;transition:all .15s;display:flex;align-items:center;gap:9px}
.nav-item:hover{background:rgba(255,255,255,.07)}
.nav-item.active{background:var(--accent);color:#fff;font-weight:700}
.sidebar-sync{font-size:11px;color:rgba(247,241,230,.38);padding:10px 10px 6px}
.sidebar-logout{margin-top:8px;padding:9px;border-radius:8px;background:rgba(255,255,255,.08);color:#f7f1e6;font-size:12.5px;transition:all .15s}
.sidebar-logout:hover{background:var(--red)}
.main{flex:1;overflow-y:auto;padding:22px 26px}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.topbar .title{font-size:22px;font-weight:800}
.date-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
.date-box label{font-size:12px;color:var(--ink-soft)}
.date-box input{border:none;font-size:13px;background:transparent}
.sync-status{font-size:12px;color:var(--ink-soft);margin-left:auto}
.view{display:none}
.view.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel{background:var(--card);border-radius:14px;padding:18px 20px;box-shadow:0 2px 14px rgba(43,36,32,.06);margin-bottom:18px}
.panel-title{font-size:15px;font-weight:800;margin-bottom:4px}
.panel-sub{font-size:12px;color:var(--ink-soft);margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--paper);color:var(--ink-soft);font-weight:700;padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:rgba(246,241,232,.5)}
.grp-badge{display:inline-flex;width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12px;align-items:center;justify-content:center}
.st-name{font-weight:600}
.eye-btns{display:flex;gap:6px}
.eye-btn{padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);font-size:12.5px;font-weight:700;transition:all .15s;background:var(--paper)}
.eye-btn:hover{border-color:var(--accent)}
.eye-btn.on-2{background:var(--green);border-color:var(--green);color:#fff}
.eye-btn.on-0{background:var(--ink-soft);border-color:var(--ink-soft);color:#fff}
.eye-btn.on--2{background:#e67e22;border-color:#e67e22;color:#fff}
.eye-btn.on--4{background:var(--red);border-color:var(--red);color:#fff}
.eye-default{font-size:11px;color:var(--ink-soft);margin-left:8px}
.btn{padding:9px 16px;border-radius:9px;font-size:13px;font-weight:700;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.member-add{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.member-add input{padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:var(--paper)}
.member-add select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:var(--paper)}
.member-add .btn{padding:9px 18px}
.grp-section{margin-bottom:14px}
.grp-head{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.grp-head .count{font-size:11px;color:var(--ink-soft);font-weight:400}
.member-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--paper)}
.member-row .name{flex:1;font-size:13px;font-weight:600}
.member-row .del{color:var(--red);font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.member-row .del:hover{background:var(--red);color:#fff}
.export-actions{display:flex;gap:10px;flex-wrap:wrap}
.empty-tip{text-align:center;padding:30px 0;color:var(--ink-soft)}
.empty-tip .big{font-size:34px;margin-bottom:8px}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.week-nav{display:flex;align-items:center;gap:8px}
.week-nav button{padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--card);font-size:12px}
.week-nav button:hover{border-color:var(--accent);color:var(--accent)}
.week-nav .wlabel{font-size:12px;color:var(--ink-soft)}

/* ---------- 纪律评分弹窗 ---------- */
.dis-modal-overlay{position:fixed;inset:0;background:rgba(30,24,20,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100}
.dis-modal-overlay.show{display:flex;animation:fade .15s ease}
.dis-modal{background:var(--card);border-radius:16px;width:480px;max-width:calc(100vw - 40px);max-height:calc(100vh - 60px);display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.28);animation:pop .2s ease;overflow:hidden}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.dis-modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dis-modal-title{font-size:18px;font-weight:800}
.dis-modal-sub{font-size:12px;color:var(--ink-soft);margin-top:4px}
.dis-modal-close{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer;font-size:14px}
.dis-modal-close:hover{background:var(--paper);color:var(--ink)}
.dis-modal-body{padding:16px 20px 8px;overflow-y:auto}
.dis-current{display:flex;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.dis-current .dis-lbl{font-size:12px;color:var(--ink-soft)}
.dis-current .dis-val{font-size:22px;font-weight:800}
.dis-current .dis-val.pos{color:var(--green)}
.dis-current .dis-val.neg{color:var(--red)}
.dis-current .dis-val.zero{color:var(--ink-soft)}
.dis-section-label{font-size:11.5px;color:var(--ink-soft);letter-spacing:.5px;margin:10px 0 7px;font-weight:600}
.dis-preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:10px}
.dis-preset-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 6px;border-radius:10px;border:1px solid var(--line);background:#faf6ee;cursor:pointer;transition:all .15s}
.dis-preset-btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(43,36,32,.1);border-color:#d8c9b2}
.dis-preset-btn:active{transform:scale(.97)}
.dis-preset-btn .pl{font-size:12px;color:var(--ink)}
.dis-preset-btn .pv{font-weight:800;font-size:15px}
.dis-preset-btn.pos .pv{color:var(--green)}
.dis-preset-btn.neg .pv{color:var(--red)}
.dis-custom-row{display:flex;gap:8px}
.dis-custom-row input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;outline:none}
.dis-custom-row input:focus{border-color:var(--accent)}
.dis-note-row{display:flex;gap:8px}
.dis-note-row input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;outline:none}
.dis-note-row input:focus{border-color:var(--accent)}
.dis-btn-primary{padding:9px 16px;border-radius:9px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer;border:none}
.dis-btn-primary:hover{filter:brightness(1.05)}
.dis-btn-ghost{padding:9px 16px;border-radius:9px;background:var(--paper);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line)}
.dis-btn-ghost:hover{border-color:var(--accent)}
.dis-btn-danger{padding:7px 14px;border-radius:8px;background:var(--accent-soft);color:var(--red);font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--accent-soft)}
.dis-btn-danger:hover{background:var(--red);color:#fff}
.dis-event-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;font-size:12.5px}
.dis-event-item .ev-val{font-weight:800;min-width:32px}
.dis-event-item .ev-val.pos{color:var(--green)}
.dis-event-item .ev-val.neg{color:var(--red)}
.dis-event-item .ev-note{color:var(--ink-soft);flex:1}
.dis-event-item .ev-by{font-size:10.5px;color:var(--ink-soft)}
.dis-event-item .ev-del{cursor:pointer;color:var(--red);font-weight:800;font-size:13px;padding:0 2px}
.dis-modal-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 14px;border-top:1px solid var(--line)}

/* ---------- 纪律表格单元格 ---------- */
.dis-cell{cursor:pointer;transition:background .12s;min-width:60px;text-align:center;padding:8px 10px}
.dis-cell:hover{background:#fdf3e6}
.dis-cell .dis-val-display{font-weight:700;font-size:14px}
.dis-cell .dis-val-display.pos{color:var(--green)}
.dis-cell .dis-val-display.neg{color:var(--red)}
.dis-cell .dis-val-display.zero{color:var(--ink-soft)}
.dis-cell .ev-count{display:inline-block;min-width:14px;height:14px;line-height:14px;border-radius:7px;background:var(--paper);color:var(--ink-soft);font-size:10px;margin-left:4px;padding:0 3px}

/* ---------- 纪律组别切换 ---------- */
.dis-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.dis-tab{padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s}
.dis-tab:hover{border-color:var(--accent)}
.dis-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- 管理面板 ---------- */
.admin-btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;
  background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:700;
  color:var(--ink);cursor:pointer;transition:all .15s;flex:none;
}
.admin-btn:hover{border-color:var(--accent);color:var(--accent)}
.admin-switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.admin-switch-title{font-size:14px;font-weight:700}
.admin-switch-sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.5}
.admin-switch{width:44px;height:24px;border-radius:999px;background:#d9cfc0;position:relative;cursor:pointer;transition:background .2s;flex:none}
.admin-switch.on{background:var(--green)}
.admin-switch .admin-switch-knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.admin-switch.on .admin-switch-knob{transform:translateX(20px)}

/* ================= 响应式适配 ================= */
@media(max-width:1100px){
  .main{padding:18px 18px}
}
@media(max-width:768px){
  .app{flex-direction:column;height:auto;min-height:100vh}
  .sidebar{
    width:100%;flex-direction:row;align-items:center;padding:6px 8px;
    position:fixed;top:0;left:0;right:0;z-index:120;flex-shrink:0;
    box-shadow:0 2px 14px rgba(30,24,20,.2);
  }
  .brand{padding:0 6px;border-bottom:none;font-size:14px;flex:none}
  .brand .ico{font-size:15px}
  .sidebar-user{display:none}
  /* 手机端独立 UI：底部固定 Tab 栏（App 风格） */
  .nav{
    position:fixed;bottom:0;left:0;right:0;top:auto;flex:none;
    width:100%;display:flex;justify-content:space-around;align-items:stretch;
    gap:2px;padding:5px 4px calc(5px + env(safe-area-inset-bottom));
    margin-top:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
    background:rgba(255,255,255,.98);
    border-top:1px solid var(--line);
    box-shadow:0 -3px 14px rgba(30,24,20,.1);
    z-index:120;
  }
  .nav-item{
    flex:1 1 0;flex-direction:column;gap:2px;
    padding:6px 2px;font-size:10.5px;white-space:nowrap;
    text-align:center;border-radius:10px;min-width:50px;
  }
  .sidebar-sync{display:none}
  .sidebar-logout{
    display:block;margin:0 2px 0 4px;padding:6px 8px;border-radius:7px;
    background:rgba(255,255,255,.08);color:#f7f1e6;font-size:11px;
    flex:none;white-space:nowrap;
  }
  .admin-btn{padding:5px 8px;font-size:11px;gap:4px}
  .main{padding:64px 12px 80px}
  .topbar .title{font-size:19px}
  .date-box{flex:1;min-width:0}
  .sync-status{display:none}
  .panel{padding:14px 14px}
  .eye-btns{flex-wrap:wrap;gap:4px}
  .eye-btn{padding:5px 9px;font-size:11.5px}
  .dis-preset-btn{padding:7px 5px}
  .dis-preset-btn .pv{font-size:13.5px}
  .dis-preset-btn .pl{font-size:11px}
  .dis-modal{width:100%;max-width:calc(100vw - 24px)}
  .dis-modal-head{padding:14px 14px 10px}
  .dis-modal-body{padding:12px 14px 8px}
  .member-add input{flex:1;min-width:120px}
  .export-actions{gap:8px}
  .export-actions .btn{flex:1;justify-content:center}
  .week-nav{flex-wrap:wrap}
}
@media(max-width:480px){
  .brand .ico{display:none}
  .brand{font-size:13px;padding:0 4px}
  .nav-item{padding:5px 2px;font-size:10px}
  .sidebar-logout{padding:5px 7px;font-size:10.5px}
  .admin-btn{padding:4px 7px;font-size:10.5px}
  .main{padding:12px 10px 78px}
  .topbar .title{font-size:17px}
  .panel{padding:12px 10px}
  .eye-btn{padding:4px 7px;font-size:10.5px}
  .dis-tab{padding:5px 10px;font-size:11.5px}
  .member-add .btn{flex:1;justify-content:center}
}

/* ================= 手机版增强（触摸目标 / 流畅滚动 / 安全区） ================= */
@media(max-width:768px){
  .btn{min-height:40px;display:inline-flex;align-items:center;justify-content:center}
  .dis-modal-body{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .dis-modal-foot{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .export-actions{flex-wrap:wrap}
  .toolbar{flex-wrap:wrap}
}
@media(max-width:480px){
  .btn{min-height:42px}
  .eye-btn{min-height:38px}
  .dis-preset-btn{min-height:44px;padding:6px 4px}
  .nav{scrollbar-width:none;-ms-overflow-style:none}
  .nav::-webkit-scrollbar{display:none}
  .modal input[type=text],.modal input[type=password],.modal input[type=number],.modal select{min-height:40px;font-size:15px}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="ico">🏫</span></div>
    <div class="sidebar-user" id="sidebarUser"></div>
    <nav class="nav">
      <div class="nav-item active" data-view="eye" onclick="switchView('eye')">👁️ 当天眼操</div>
      <div class="nav-item" data-view="dis" onclick="switchView('dis')">📋 当天纪律</div>
      <div class="nav-item" data-view="members" onclick="switchView('members')">👥 成员管理</div>
      <div class="nav-item" data-view="order" onclick="switchView('order')">🔀 调整顺序</div>
      <div class="nav-item" data-view="export" onclick="switchView('export')">📤 数据导出</div>
    </nav>
    <div class="sidebar-sync" id="sidebarSync">☁️ 未同步</div>
    <button class="sidebar-logout" onclick="logout()">退出登录</button>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="admin-btn" id="adminBtn" style="display:none" onclick="openAdminModal()">⚙️ 管理</button>
      <div class="title" id="viewTitle">当天眼操</div>
      <div class="date-box">
        <label>日期</label>
        <input type="date" id="curDate" onchange="onDateChange()">
      </div>
      <button class="btn btn-ghost btn-sm" onclick="cloudPush()" title="上传本地数据到云端">☁️ 上传</button>
      <button class="btn btn-ghost btn-sm" onclick="cloudPullMerge()" title="从云端提取数据">☁️ 提取</button>
      <div class="sync-status" id="syncStatus"></div>
    </div>

    <!-- 眼操 -->
    <div class="view active" id="view-eye">
      <div class="panel">
        <div class="panel-title">👁️ 当天眼操记录</div>
        <div class="dis-tabs" id="eyeTabs"></div>
        <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
          <table id="eyeTable"></table>
        </div>
      </div>
    </div>

    <!-- 纪律 -->
    <div class="view" id="view-dis">
      <div class="panel">
        <div class="panel-title">📋 当天纪律</div>
        <div class="dis-tabs" id="disTabs"></div>
        <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
          <table id="disTable"></table>
        </div>
      </div>
    </div>

    <!-- 成员管理 -->
    <div class="view" id="view-members">
      <div class="panel">
        <div class="panel-title">👥 成员管理（<span id="memberCount">0</span> 人）</div>
        <div class="member-add">
          <input type="text" id="newMemberName" placeholder="学生姓名">
          <select id="newMemberGroup">
            <option value="1">第1组</option><option value="2">第2组</option><option value="3">第3组</option>
            <option value="4">第4组</option><option value="5">第5组</option><option value="6">第6组</option>
            <option value="7">第7组</option><option value="8">第8组</option><option value="9">第9组</option>
            <option value="10">第10组</option>
          </select>
          <button class="btn btn-primary" onclick="addMember()">＋ 添加学生</button>
        </div>
        <div id="memberList"></div>
      </div>
    </div>

    <!-- 调整顺序 -->
    <div class="view" id="view-order">
      <div class="panel">
        <div class="panel-title">🔀 调整顺序</div>
        <div style="margin-bottom:14px">
          <button class="btn btn-ghost" onclick="sortByGroup()">🔃 按组排序</button>
        </div>
        <div id="orderList"></div>
      </div>
    </div>

    <!-- 导出 -->
    <div class="view" id="view-export">
      <div class="panel">
        <div class="panel-title">📤 导出数据</div>
        <div class="week-nav" style="margin-bottom:16px">
          <button onclick="shiftWeek(-1)">← 上一周</button>
          <span class="wlabel" id="weekLabel"></span>
          <button onclick="shiftWeek(1)">下一周 →</button>
        </div>
        <div class="export-actions">
          <button class="btn btn-primary" onclick="exportWeek()">📥 导出本周数据（Excel）</button>
        </div>
        <div style="margin-top:14px;font-size:12px;color:var(--ink-soft)" id="exportPreview"></div>
      </div>

async function doChangePwdMe(){
  const old=document.getElementById('pwdMeOld').value;
  const np=document.getElementById('pwdMeNew').value;
  const np2=document.getElementById('pwdMeNew2').value;
  const err=document.getElementById('pwdMeErr');
  if(!currentUser){err.textContent='请先登录';return;}
  if(!old){err.textContent='请输入当前密码';return;}
  if(!np){err.textContent='请输入新密码';return;}
  if(np!==np2){err.textContent='两次输入的新密码不一致';return;}
  if(!SB){err.textContent='无法连接认证服务，请检查网络';return;}
  try{
    const {error:ve}=await SB.auth.signInWithPassword({email:currentUser.name+'@jfz.local',password:old});
    if(ve){err.textContent='当前密码错误';return;}
    const {error:ue}=await SB.rpc('change_my_password',{old_password:old,new_password:np});
    if(ue){err.textContent='修改失败：'+(ue.message||'未知错误');return;}
    err.textContent='';
    document.getElementById('pwdMeOld').value='';
    document.getElementById('pwdMeNew').value='';
    document.getElementById('pwdMeNew2').value='';
    alert('密码修改成功，请使用新密码登录');

}

function checkCloudThrottle(){
  const now=Date.now();

}

  return remote;
}

async function ensureSbToken(){

async function sbFetch(path,options){
  const token=await ensureSbToken();
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),8000);
  try{
    const resp=await fetch(SUPABASE_URL+'/rest/v1/'+path,Object.assign({

    },options||{},{

  }finally{
    clearTimeout(timer);

    if(!remote||!remote.students)return;
    if(remote.admin2Enabled!==undefined)state.admin2Enabled=remote.admin2Enabled;
    if(remote.version!==state.version)return;
    const lt=state.lastModified||0;
    const rt=remote.lastModified||0;
    if(!silent&&lt>rt&&!confirm('本地有更新的数据（比云端新），确定用云端覆盖本地吗？')){cloudSyncing=false;setSyncStatus('已取消','var(--ink-soft)');return;}
    state=mergeState(state,remote);
    saveLocal();
    render();
    if(checkAdmin2Kick())return;
    cloudCfg.lastSync=Date.now();saveCloudCfg();
    setSyncStatus('✅ 已从云端拉取 '+new Date().toLocaleTimeString('zh-CN'),'var(--green)');
    if(!silent)toast('已从云端拉取数据');
  }catch(e){}
  cloudSyncing=false;
}
function mergeState(local,remote){
  const out=JSON.parse(JSON.stringify(local));
  if(!out.eyeRecords)out.eyeRecords={};
  if(!out.disRecords)out.disRecords={};
  const rEye=remote.eyeRecords||{};
  for(const dk in rEye){
    if(!out.eyeRecords[dk])out.eyeRecords[dk]={};
    Object.assign(out.eyeRecords[dk],rEye[dk]);
  }
  const rDis=remote.disRecords||{};
  for(const dk in rDis){
    if(!out.disRecords[dk])out.disRecords[dk]={};
    for(const sid in rDis[dk]){
      if(!out.disRecords[dk][sid])out.disRecords[dk][sid]=[];
      const map=new Map(out.disRecords[dk][sid].map(n=>[n.id,n]));
      (rDis[dk][sid]||[]).forEach(n=>{if(!map.has(n.id))map.set(n.id,n);});
      out.disRecords[dk][sid]=[...map.values()];
    }
  }
  const stMap=new Map(out.students.map(s=>[s.id,s]));
  (remote.students||[]).forEach(s=>{if(!stMap.has(s.id))stMap.set(s.id,s);});
  out.students=[...stMap.values()];
  if(remote.admin2Enabled!==undefined)out.admin2Enabled=remote.admin2Enabled;
  dedupeStudents(out);
  return out;
}
function dedupeStudents(st){
  const count=sid=>{
    let c=0;
    for(const dk in st.eyeRecords)if(st.eyeRecords[dk][sid]!==undefined)c++;
    for(const dk in st.disRecords)if(st.disRecords[dk][sid])c+=st.disRecords[dk][sid].length;
    return c;
  };
  const best=new Map();
  for(const s of st.students){
    const key=s.group+':'+s.name;
    const score=count(s.id);
    if(!best.has(key)||score>best.get(key).score)best.set(key,{student:s,score});
  }
  const idMap=new Map();
  const kept=[];
  for(const s of st.students){
    const b=best.get(s.group+':'+s.name);
    if(b.student.id===s.id)kept.push(s);
    else idMap.set(s.id,b.student.id);
  }
  if(idMap.size===0)return false;
  for(const dk in st.eyeRecords){
    const day=st.eyeRecords[dk];
    for(const oldId in day){
      if(idMap.has(oldId)){
        const newId=idMap.get(oldId);
        if(day[newId]===undefined)day[newId]=day[oldId];
        delete day[oldId];
      }
    }
  }
  for(const dk in st.disRecords){
    const day=st.disRecords[dk];
    for(const oldId in day){
      if(idMap.has(oldId)){
        const newId=idMap.get(oldId);
        if(!day[newId])day[newId]=[];
        const map=new Map(day[newId].map(n=>[n.id,n]));
        (day[oldId]||[]).forEach(n=>{if(!map.has(n.id))map.set(n.id,n);});
        day[newId]=[...map.values()];
        delete day[oldId];
      }
    }
  }
  st.students=kept;
  return true;
}

function exportWeek(){
  const days=[0,1,2,3,4].map(i=>addDays(exportWeekStart,i));
  const weekNames=['周一','周二','周三','周四','周五'];
  const headers=['项目'].concat(sortedStudents().map(s=>s.name));
  const rows=[headers];
  days.forEach((d,di)=>{
    const dk=fmtDate(d);
    const row=[weekNames[di]+'（眼操+纪律）'];
    sortedStudents().forEach(s=>{
      const v=(state.eyeRecords[dk]||{})[s.id];
      const eye=v===undefined?2:v;
      const notes=(state.disRecords[dk]||{})[s.id]||[];
      const dis=notes.reduce((a,n)=>a+(n.value||0),0);
      row.push(eye+'+'+dis);
    });
    rows.push(row);
  });
  const totalRow=['本周合计'];
  sortedStudents().forEach(s=>{
    let t=0;
    days.forEach(d=>{
      const dk=fmtDate(d);
      const v=(state.eyeRecords[dk]||{})[s.id];
      t+=(v===undefined?2:v);
      const notes=(state.disRecords[dk]||{})[s.id]||[];
      t+=notes.reduce((a,n)=>a+(n.value||0),0);
    });
    totalRow.push(t);
  });
  rows.push(totalRow);
  exportExcel(rows,'班级纪律眼操_'+weekNames[0]);
}
function download(name,content,mime){
  const blob=new Blob([content],{type:mime||'application/octet-stream'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},100);
}

function importClassData(input){
  const f=input.files[0];
  if(!f)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.students)throw new Error('格式错误');
      if(!confirm('导入备份将覆盖当前全部数据，确定继续吗？'))return;
      if(!data.eyeRecords)data.eyeRecords={};
      if(!data.disRecords)data.disRecords={};
      dedupeStudents(data);
      state=data;
      save();render();
      toast('数据已恢复');
    }catch(err){toast('导入失败：文件格式不正确');}
  };
  reader.readAsText(f);
  input.value='';
}
function loadXLSX(){
  return new Promise((resolve,reject)=>{
    if(window.XLSX){resolve(window.XLSX);return;}
    const urls=[
      'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
      'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
      'https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
    ];
    let i=0;
    function tryNext(){
      if(i>=urls.length){reject(new Error('XLSX 加载失败'));return;}
      const s=document.createElement('script');
      s.src=urls[i++];
      s.onload=()=>{window.XLSX?resolve(window.XLSX):tryNext();};
      s.onerror=()=>tryNext();
      document.head.appendChild(s);
    }
    tryNext();
  });
}
function exportExcel(rows,filename){
  loadXLSX().then(XLSX=>{
    const ws=XLSX.utils.aoa_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'数据');
    XLSX.writeFile(wb,filename+'.xlsx');
    toast('已导出 Excel');
  }).catch(()=>{
    toast('Excel 组件加载失败，请检查网络后重试');
  });
}

        // 云端拉取失败：不基于本地旧缓存判定 admin2，避免误踢
        toast('云端数据加载失败，请检查网络');
        return;
      }
      if(!remote.students)return;
      if(remote.admin2Enabled!==undefined)state.admin2Enabled=remote.admin2Enabled;
      if(checkAdmin2Kick())return;
      if(remote.version!==state.version)return;
      const localHasData=Object.keys(state.eyeRecords||{}).length>0||Object.keys(state.disRecords||{}).length>0;
      const lt=state.lastModified||0;
      const rt=remote.lastModified||0;
      if(!localHasData||rt>lt){
        state=mergeState(state,remote);
        saveLocal();
        render();
        renderWeekLabel();
        toast(!localHasData?'已从云端加载数据':'已更新为云端最新数据');
      }else if(lt>rt){
        toast('本地有未上传的数据，已保留本地版本');
      }
      setSyncStatus('✅ 云端数据已就绪','var(--green)');
    }catch(e){
      // 拉取异常同样不踢 admin2（避免"有几率误判为不可用"）
      toast('云端数据加载失败，请检查网络');
    }
  })();
})();
</script>
</body>
</html>
