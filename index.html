<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国庆快乐 - 班级积分管理系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇨🇳</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:#1a1a1a;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;
  -webkit-font-smoothing:antialiased;
}

/* 主卡片 */
.main-card{
  background:#222;
  border:2px solid #c9a84c;
  border-radius:20px;padding:40px 36px;
  width:100%;max-width:440px;
  text-align:center;position:relative;
  box-shadow:0 0 40px rgba(201,168,76,.15);
}

/* 国旗 - 正确的五星红旗 */
.flag-wrap{
  width:140px;height:93px;
  margin:0 auto 24px;
  border-radius:4px;overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,.5);
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
}
.flag{
  width:100%;height:100%;
  background:#DE2910;
  position:relative;
}
/* 大星：左上方，直径约为旗高的3/10 */
.flag .big-star{
  position:absolute;
  top:14px;left:16px;
  font-size:32px;
  color:#FFDE00;
  line-height:1;
}
/* 四颗小星：各有一角正对大星中心 */
.flag .small-star{
  position:absolute;
  color:#FFDE00;
  font-size:11px;
  line-height:1;
}
/* 第一颗小星：大星右上方 */
.flag .s1{top:8px;left:52px;transform:rotate(20deg)}
/* 第二颗小星：大星右方偏上 */
.flag .s2{top:20px;left:62px;transform:rotate(45deg)}
/* 第三颗小星：大星右方偏下 */
.flag .s3{top:34px;left:60px;transform:rotate(-20deg)}
/* 第四颗小星：大星右下方 */
.flag .s4{top:46px;left:50px;transform:rotate(-45deg)}

.title{
  font-size:34px;font-weight:900;
  color:#E74C3C;
  margin-bottom:8px;letter-spacing:6px;
  text-shadow:0 2px 8px rgba(231,76,60,.3);
}
.subtitle{
  font-size:15px;color:#c9a84c;
  margin-bottom:24px;font-weight:600;letter-spacing:2px;
  line-height:1.6;
}

.divider{
  width:60px;height:2px;
  background:linear-gradient(90deg,transparent,#c9a84c,transparent);
  margin:0 auto 28px;
}

.maint-box{
  background:rgba(201,168,76,.08);
  border:1px solid rgba(201,168,76,.3);
  border-radius:14px;
  padding:24px 20px;margin-bottom:8px;
}
.maint-icon{
  font-size:32px;margin-bottom:12px;
}
.maint-title{
  font-size:18px;font-weight:800;
  color:#c9a84c;margin-bottom:12px;
  letter-spacing:2px;
}
.maint-text{
  font-size:14px;color:#bbb;line-height:2;
}
.maint-text .date{color:#E74C3C;font-weight:700}

.countdown{
  display:flex;justify-content:center;gap:12px;margin-top:20px;
}
.countdown-item{
  background:#1a1a1a;
  border:1px solid rgba(201,168,76,.3);
  border-radius:10px;padding:10px 12px;
  min-width:58px;
}
.countdown-num{
  font-size:26px;font-weight:900;color:#E74C3C;
  font-variant-numeric:tabular-nums;
}
.countdown-label{
  font-size:11px;color:#888;margin-top:4px;font-weight:600;
}

.footer-tip{
  font-size:12px;color:#666;margin-top:20px;line-height:1.7;
}

/* admin登录表单（默认隐藏） */
.admin-login{
  display:none;
  text-align:left;
}
.admin-login h2{
  font-size:20px;color:#c9a84c;text-align:center;
  margin-bottom:20px;letter-spacing:2px;
}
.admin-field{margin-bottom:14px}
.admin-field label{
  display:block;font-size:12px;color:#999;
  margin-bottom:6px;font-weight:600;
}
.admin-field input{
  width:100%;padding:11px 13px;
  border:1px solid #444;border-radius:8px;
  font-size:14px;background:#1a1a1a;color:#eee;
  outline:none;transition:border .15s;
}
.admin-field input:focus{border-color:#c9a84c}
.admin-btn{
  width:100%;padding:12px;border:none;border-radius:8px;
  background:linear-gradient(135deg,#c9a84c,#b8941f);
  color:#1a1a1a;font-size:15px;font-weight:700;
  cursor:pointer;margin-top:6px;transition:all .15s;
}
.admin-btn:hover{filter:brightness(1.1)}
.admin-back{
  text-align:center;font-size:12px;color:#666;
  margin-top:14px;cursor:pointer;
}
.admin-back:hover{color:#c9a84c}
.admin-err{
  font-size:12px;color:#E74C3C;margin-top:10px;
  min-height:16px;text-align:center;
}

/* 响应式 */
@media(max-width:480px){
  .main-card{padding:28px 20px;border-radius:16px}
  .title{font-size:28px;letter-spacing:4px}
  .flag-wrap{width:120px;height:80px}
  .flag .big-star{font-size:28px;top:12px;left:14px}
  .flag .small-star{font-size:10px}
  .flag .s1{top:7px;left:45px}
  .flag .s2{top:17px;left:54px}
  .flag .s3{top:30px;left:52px}
  .flag .s4{top:40px;left:43px}
  .maint-title{font-size:16px}
  .maint-text{font-size:13px}
  .countdown-num{font-size:22px}
  .countdown-item{padding:8px 10px;min-width:50px}
}
</style>
</head>
<body>

<div class="main-card" id="maintView">
  <!-- 国旗（连点5次进入admin登录） -->
  <div class="flag-wrap" id="flag" title="">
    <div class="flag">
      <span class="big-star">★</span>
      <span class="small-star s1">★</span>
      <span class="small-star s2">★</span>
      <span class="small-star s3">★</span>
      <span class="small-star s4">★</span>
    </div>
  </div>

  <div class="title">国庆快乐</div>
  <div class="subtitle">庆祝中华人民共和国成立77周年</div>

  <div class="divider"></div>

  <div class="maint-box">
    <div class="maint-icon">🔧</div>
    <div class="maint-title">系统维护通知</div>
    <div class="maint-text">
      维护时间：即日起至 <span class="date">10月4日</span><br>
      维护期间暂停登录服务<br>
      给您带来的不便敬请谅解
    </div>

    <div class="countdown" id="countdown">
      <div class="countdown-item">
        <div class="countdown-num" id="cd-days">--</div>
        <div class="countdown-label">天</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-num" id="cd-hours">--</div>
        <div class="countdown-label">时</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-num" id="cd-mins">--</div>
        <div class="countdown-label">分</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-num" id="cd-secs">--</div>
        <div class="countdown-label">秒</div>
      </div>
    </div>
  </div>

  <div class="footer-tip">祝全体师生国庆假期愉快</div>
</div>

<!-- Admin登录视图 -->
<div class="main-card admin-login" id="adminView">
  <h2>管理员登录</h2>
  <div class="admin-field">
    <label>用户名</label>
    <input type="text" id="adminName" placeholder="输入管理员用户名" autocomplete="username">
  </div>
  <div class="admin-field">
    <label>密码</label>
    <input type="password" id="adminPwd" placeholder="输入密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAdminLogin()">
  </div>
  <button class="admin-btn" onclick="doAdminLogin()">登 录</button>
  <div class="admin-err" id="adminErr"></div>
  <div class="admin-back" onclick="backToMaint()">← 返回维护页面</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://zaeijgfuykhkabteqljw.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphZWlqZ2Z1eWtoa2FidGVxbGp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1ODA5MzgsImV4cCI6MjEwNDE1NjkzOH0.CQ-jqsslzaWpeeXg0OJnQsaW-iMNoCKbJGW_-p1F3D8';
const SB=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;

/* 连点5次国旗进入admin登录 */
let flagClickCount=0;
let flagClickTimer=null;
document.getElementById('flag').addEventListener('click',function(){
  flagClickCount++;
  clearTimeout(flagClickTimer);
  flagClickTimer=setTimeout(()=>{flagClickCount=0},1500);
  if(flagClickCount>=5){
    flagClickCount=0;
    document.getElementById('maintView').style.display='none';
    document.getElementById('adminView').style.display='block';
  }
});

function backToMaint(){
  document.getElementById('adminView').style.display='none';
  document.getElementById('maintView').style.display='block';
  document.getElementById('adminErr').textContent='';
}

/* Admin登录 */
async function doAdminLogin(){
  const btn=document.querySelector('.admin-btn');
  btn.disabled=true;btn.textContent='登录中...';
  const name=document.getElementById('adminName').value.trim();
  const pwd=document.getElementById('adminPwd').value;
  const err=document.getElementById('adminErr');
  if(!name){btn.disabled=false;btn.textContent='登 录';err.textContent='请输入用户名';return;}
  if(!pwd){btn.disabled=false;btn.textContent='登 录';err.textContent='请输入密码';return;}
  if(!SB){btn.disabled=false;btn.textContent='登 录';err.textContent='无法连接服务';return;}
  
  const email=(name==='admin'||name==='teacher'||name==='admin2')?name+'@jfz.local':name+'@jfz.local';
  
  try{
    const res=await SB.auth.signInWithPassword({email,password:pwd});
    if(res.error||!res.data.user){
      btn.disabled=false;btn.textContent='登 录';
      err.textContent='用户名或密码错误';
      return;
    }
    // 登录成功，查询角色
    let role='user',gid=null;
    try{
      const rresp=await fetch(SUPABASE_URL+'/rest/v1/users?email=eq.'+encodeURIComponent(email)+'&select=username,role,group_id',{
        headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+res.data.session.access_token}
      });
      const rrows=await rresp.json();
      if(rrows&&rrows.length){role=rrows[0].role||'user';gid=rrows[0].group_id||null;}
    }catch(e){}
    
    if(role==='user'){
      btn.disabled=false;btn.textContent='登 录';
      err.textContent='该账号无管理员权限';
      await SB.auth.signOut();
      return;
    }
    
    localStorage.setItem('jfz_session_v1',JSON.stringify({name,role,groupId:gid||undefined}));
    location.href='group.html';
  }catch(e){
    btn.disabled=false;btn.textContent='登 录';
    err.textContent='网络错误，请重试';
  }
}

/* 倒计时 */
(function(){
  const target=new Date('2026-10-04T00:00:00+08:00').getTime();
  function update(){
    const now=Date.now();
    let diff=target-now;
    if(diff<=0){
      document.getElementById('cd-days').textContent='0';
      document.getElementById('cd-hours').textContent='00';
      document.getElementById('cd-mins').textContent='00';
      document.getElementById('cd-secs').textContent='00';
      return;
    }
    const days=Math.floor(diff/86400000);diff%=86400000;
    const hours=Math.floor(diff/3600000);diff%=3600000;
    const mins=Math.floor(diff/60000);diff%=60000;
    const secs=Math.floor(diff/1000);
    document.getElementById('cd-days').textContent=days;
    document.getElementById('cd-hours').textContent=String(hours).padStart(2,'0');
    document.getElementById('cd-mins').textContent=String(mins).padStart(2,'0');
    document.getElementById('cd-secs').textContent=String(secs).padStart(2,'0');
  }
  update();
  setInterval(update,1000);
})();
</script>
</body>
</html>
