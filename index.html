<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国庆快乐 - 系统维护中</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.card{
  background:#fff;border-radius:20px;padding:48px 40px;
  max-width:420px;width:100%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.flag{
  width:120px;height:80px;margin:0 auto 24px;
  border-radius:6px;overflow:hidden;
  box-shadow:0 8px 24px rgba(222,41,16,.3);
  position:relative;background:#DE2910;
}
.flag .big{position:absolute;top:12px;left:14px;color:#FFDE00;font-size:28px}
.flag .s{position:absolute;color:#FFDE00;font-size:12px}
.flag .s1{top:6px;left:46px;transform:rotate(15deg)}
.flag .s2{top:16px;left:54px;transform:rotate(35deg)}
.flag .s3{top:28px;left:52px;transform:rotate(-15deg)}
.flag .s4{top:38px;left:44px;transform:rotate(-35deg)}
h1{
  font-size:32px;font-weight:800;
  background:linear-gradient(135deg,#C41E3A,#E74C3C);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;margin-bottom:8px;letter-spacing:3px;
}
.sub{font-size:14px;color:#999;margin-bottom:28px;letter-spacing:1px}
.line{width:50px;height:3px;background:linear-gradient(90deg,#C41E3A,#E74C3C);margin:0 auto 28px;border-radius:2px}
.notice{
  background:#fef5f5;border:1px solid #fdd;border-radius:12px;
  padding:20px;margin-bottom:8px;
}
.notice p{font-size:14px;color:#555;line-height:2}
.notice .date{color:#C41E3A;font-weight:700}
.footer{font-size:12px;color:#bbb;margin-top:24px}
</style>
</head>
<body>
<div class="card">
  <div class="flag">
    <span class="big">★</span>
    <span class="s s1">★</span>
    <span class="s s2">★</span>
    <span class="s s3">★</span>
    <span class="s s4">★</span>
  </div>
  <h1>国庆快乐</h1>
  <div class="sub">1949 — 2026</div>
  <div class="line"></div>
  <div class="notice">
    <p>系统维护升级中</p>
    <p>维护至 <span class="date">10月4日</span>，期间暂停登录</p>
    <p>感谢您的理解与支持</p>
  </div>
  <div class="footer">祝全体师生国庆假期愉快</div>
</div>
</body>
</html>
