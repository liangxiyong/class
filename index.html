<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班级积分管理系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<style>
:root{
  --paper:#f5f5f5;
  --card:#ffffff;
  --ink:#1a1a1a;
  --ink-soft:#666666;
  --line:#e8e8e8;
  --accent:#d32f2f;
  --accent-soft:#fff0f0;
  --green:#4caf50;
  --red:#e53935;
  --font-song:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font-song);color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
}
button{font-family:var(--font-song);cursor:pointer;border:none;background:none;color:inherit}
input{font-family:var(--font-song);color:inherit}
.login-overlay{
  position:fixed;inset:0;
  background:
    radial-gradient(900px 500px at 80% -10%, rgba(211,47,47,.1), transparent 55%),
    radial-gradient(700px 400px at -5% 105%, rgba(46,125,50,.07), transparent 55%),
    linear-gradient(160deg,#ece3d2,#f7f1e6 50%,#faf6f0);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.login-box{
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid rgba(255,255,255,.7);
  border-radius:18px;padding:34px 30px;width:100%;max-width:380px;
  box-shadow:0 28px 80px rgba(60,45,30,.18),0 2px 10px rgba(60,45,30,.06);
  text-align:center;
  animation:pop .25s ease;
}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.login-mark{
  width:58px;height:58px;border-radius:16px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;background:#ffffff;
}
.login-mark svg{width:100%;height:100%;display:block}
.login-title{font-size:20px;font-weight:700;color:var(--accent);margin-bottom:4px;letter-spacing:2px}
.login-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:22px}
.login-field{text-align:left;margin-bottom:14px}
.login-field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:400}
.login-field input{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  font-size:14px;outline:none;background:#ffffff;color:var(--ink);transition:border .15s;
}
.login-field input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(211,47,47,.1)}
.login-btn{
  width:100%;padding:12px;border:none;border-radius:8px;background:var(--accent);color:#ffffff;
  font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;transition:all .15s;letter-spacing:2px;
}
.login-btn:hover{background:#c62828}
.login-btn:disabled{opacity:.5;cursor:not-allowed;background:#bfbfbf}
.login-err{font-size:12px;color:var(--red);margin-top:10px;min-height:16px}
.login-tip{font-size:11.5px;color:var(--ink-soft);margin-top:14px;line-height:1.7}
.choose-box{display:none;margin-top:4px}
.choose-btn{
  width:100%;padding:15px;border-radius:12px;border:1px solid var(--line);
  background:#ffffff;font-size:15px;font-weight:400;color:var(--ink);
  margin-bottom:12px;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:10px;
}
.choose-btn:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.choose-btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;background:#f5f5f5}
.choose-btn .ico{font-size:20px}
.choose-back{font-size:12px;color:var(--ink-soft);cursor:pointer;margin-top:6px}
.choose-back:hover{color:var(--accent)}
.role-tag{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);
  background:#f5f5f5;border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin-bottom:18px;
}
.role-tag b{color:var(--accent)}
.login-remember{margin:4px 0 10px;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.login-remember input{width:16px;height:16px;cursor:pointer}
.login-remember label{cursor:pointer;display:flex;align-items:center;gap:6px}
.tip-box{
  font-size:12px;color:var(--ink-soft);line-height:1.7;margin-top:14px;padding:10px 12px;
  background:var(--accent-soft);border:1px solid rgba(211,47,47,.15);border-radius:8px;text-align:left;
}
.tip-box .tip-title{font-weight:600;margin-bottom:4px;color:var(--accent)}

@media(max-width:480px){
  .login-overlay{padding:14px}
  .login-box{padding:24px 18px;border-radius:16px}
  .login-title{font-size:17px}
  .login-mark{width:44px;height:44px;font-size:21px;border-radius:12px}
  .choose-btn{padding:12px;font-size:14px}
  .login-field input{min-height:44px;font-size:15px}
  .login-btn{min-height:46px;font-size:15px}
  .choose-btn{min-height:46px}
}
</style>

  <div class="login-box">
    <div class="login-mark"><svg width="40" height="40" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 32L20 24L26 28L36 16" stroke="#f5c542" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 16H36V20" stroke="#f5c542" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="28" width="4" height="8" rx="1" fill="#e8a838"/><rect x="22" y="24" width="4" height="12" rx="1" fill="#f5c542"/><rect x="30" y="20" width="4" height="16" rx="1" fill="#e8a838"/></svg></div>

    <div id="loginFields">

      <div class="tip-box">
        <div class="tip-title">登录说明</div>
        <div>· 组长：用户名 = 组长姓名，密码 = 小组号（如第 3 组组长密码为 3）</div>

    <div class="choose-box" id="chooseBox">
      <div class="role-tag">已登录：<b id="chooseName"></b></div>
      <button class="choose-btn" onclick="go('group.html')"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 20V10M10 20V4M16 20V14M22 20H2" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>小组积分</button>
      <button class="choose-btn" id="chooseClassV2Btn" style="display:none" onclick="go('class_v2.html')"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 15C16.4183 15 20 12.3137 20 9C20 5.68629 16.4183 3 12 3C7.58172 3 4 5.68629 4 9C4 12.3137 7.58172 15 12 15Z" stroke="#d4af37" stroke-width="2"/><path d="M8 14L6 21L12 18L18 21L16 14" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>班级管理</button>
      <button class="choose-btn" id="chooseNoticeBtn" style="display:none" onclick="go('notice_admin.html')"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 8A6 6 0 0 0 6 8C6 15 3 17 3 17H21C21 17 18 15 18 8Z" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21A2 2 0 0 1 10.27 21" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>公告管理</button>
      <div class="choose-back" onclick="backToLogin()">← 返回重新登录</div>
    </div>
  </div>
</div>

/* ================= 配置（首尔节点） ================= */
const SESSION_KEY='jfz_session_v1';
const SUPABASE_URL='https://jfz-proxy-api.pages.dev';
const SUPABASE_ANON_KEY='sb_publishable_B5VRNPT7oJaoX-x6IeprIg_bb5LZCJX';

/* 高德地图 IP 定位 Key（Web服务） */
const AMAP_KEY='8a663ae5117598bc86588e3418cc572e';

/* ================= Cloudflare Turnstile 人机验证 ================= */
const TURNSTILE_SITE_KEY='0x4AAAAAAFMym-bVxn7VE__p'; // managed模式
let turnstileWidgetId=null;
let turnstileVerified=false;

/* Turnstile 验证成功回调 */
function onTurnstileSuccess(token){
  console.log('[Turnstile] 验证成功，token前10位=',token.substring(0,10));
  turnstileVerified=true;
  const btn=document.getElementById('loginBtn');
  if(btn){btn.disabled=false;btn.style.opacity='1';btn.style.cursor='pointer';}
}

/* Turnstile 验证失败回调 */
function onTurnstileError(errorCode){
  console.error('[Turnstile] 验证失败：',errorCode);
  turnstileVerified=false;
  const btn=document.getElementById('loginBtn');
  if(btn){btn.disabled=true;btn.style.opacity='0.5';btn.style.cursor='not-allowed';}
}

/* Turnstile 过期回调 */
function onTurnstileExpire(){
  console.log('[Turnstile] 验证已过期，需要重新验证');
  turnstileVerified=false;
  const btn=document.getElementById('loginBtn');
  if(btn){btn.disabled=true;btn.style.opacity='0.5';btn.style.cursor='not-allowed';}
  // 自动重新渲染
  if(turnstileWidgetId&&window.turnstile){
    try{window.turnstile.reset(turnstileWidgetId);}catch(e){}
  }
}

/* 初始化 Turnstile（等SDK加载完成后调用） */
function initTurnstile(){
  const container=document.getElementById('turnstileWidget');
  if(!container||!window.turnstile){return;}
  if(turnstileWidgetId){return;} // 已初始化
  try{
    turnstileWidgetId=window.turnstile.render('#turnstileWidget',{
      sitekey:TURNSTILE_SITE_KEY,
      callback:onTurnstileSuccess,
      'error-callback':onTurnstileError,
      'expired-callback':onTurnstileExpire,
      theme:'light',
      language:'zh-CN'
    });
    console.log('[Turnstile] 组件初始化成功，widgetId=',turnstileWidgetId);
  }catch(e){
    console.error('[Turnstile] 初始化失败：',e);
  }
}

/* 轮询等待 Turnstile SDK 加载完成，然后初始化 */
(function waitForTurnstile(){
  if(window.turnstile){
    initTurnstile();
  }else{
    setTimeout(waitForTurnstile,200);
  }
})();

/* Supabase 客户端：auth + realtime 优化参数 */
const SB=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true},
  realtime:{
    reconnectAfterMs:function(tries){
      var backoff=[5000,8000,12000,20000,30000];
      return backoff[Math.min(tries-1,backoff.length-1)];
    },
    timeout:15000,
    heartbeatIntervalMs:8000
  }
}):null;

/* ================= 登录 IP 定位与日志记录 ================= */
let cachedIpInfo=null;  // 缓存的IP信息，页面加载时预获取
let ipInfoLoading=false; // 是否正在加载IP信息

/* 处理高德返回的字段（可能是"[]"字符串或空数组） */
function cleanAmapField(v){
  if(v===null||v===undefined)return '';
  if(Array.isArray(v))return v.length?v[0]:'';
  if(typeof v==='string'){
    if(v==='[]'||v===''||v==='null')return '';
    return v;
  }
  return String(v);
}

/* 获取用户IP和地理位置（通过Cloudflare代理获取，支持IPv6，稳定可靠） */
async function getUserIp(){
  try{
    // 支持页面URL带 ?debug=省份|城市 调试参数，传递给代理模拟地理位置
    const debugParam=new URLSearchParams(location.search).get('debug');
    const url=SUPABASE_URL+'/ip'+(debugParam?'?debug='+encodeURIComponent(debugParam):'');
    const res=await fetch(url);
    const data=await res.json();
    return data||{};
  }catch(e){
    console.error('[登录日志] 从代理获取IP失败：',e);
    return {};
  }
}

/* 页面加载时预获取IP信息（不阻塞登录，后台静默执行） */
async function preloadIpInfo(){
  if(ipInfoLoading||cachedIpInfo)return;
  ipInfoLoading=true;
  try{
    // 优先从代理获取IP和地理位置（Cloudflare自带，支持IPv6）
    const proxyData=await getUserIp();
    let province=cleanAmapField(proxyData.province||'');
    let city=cleanAmapField(proxyData.city||'');
    let adcode=cleanAmapField(proxyData.postalCode||'');
    // 如果代理没有返回省/市，再调用高德作为备选
    if(!province||!city){
      try{
        const amapRes=await fetch('https://restapi.amap.com/v3/ip?key='+AMAP_KEY).then(r=>r.json()).catch(()=>null);
        console.log('[登录日志] 预加载 - 代理省/市为空，调用高德备选，返回=',amapRes);
        if(amapRes){
          province=province||cleanAmapField(amapRes.province||'');
          city=city||cleanAmapField(amapRes.city||'');
          adcode=adcode||cleanAmapField(amapRes.adcode||'');
        }
      }catch(e){}
    }
    console.log('[登录日志] 预加载 - ip=',proxyData.ip||'',' province=',province,' city=',city);
    cachedIpInfo={
      ip:proxyData.ip||'',
      province:province,
      city:city,
      adcode:adcode,
      rectangle:''
    };
  }catch(e){
    console.error('[登录日志] 预加载异常：',e);
  }finally{
    ipInfoLoading=false;
  }
}
preloadIpInfo(); // 立即执行

/* ================= 隐藏开发者模式（连续点击图标7次触发） ================= */
(function(){
  let devClickCount=0;
  let devClickTimer=null;
  const mark=document.querySelector('.login-mark');
  if(!mark)return;
  mark.style.cursor='pointer';
  mark.title='';
  mark.addEventListener('click',function(){
    devClickCount++;
    if(devClickTimer)clearTimeout(devClickTimer);
    devClickTimer=setTimeout(function(){devClickCount=0;},1500); // 1.5秒内连续点击才算
    if(devClickCount>=7){
      devClickCount=0;
      if(devClickTimer)clearTimeout(devClickTimer);
      const path=prompt('🔧 隐藏跳转模式\n\n输入跳转路径（如 group、class_v2、notice_admin）：\n→ https://class-amv.pages.dev/路径');
      if(path&&path.trim()){
        location.href='https://class-amv.pages.dev/'+path.trim();
      }
    }
  });
})();

/* 获取IP信息（优先用缓存，缓存为空则实时获取） */
async function getIpInfo(){
  if(cachedIpInfo)return cachedIpInfo;
  try{
    // 优先从代理获取IP和地理位置（Cloudflare自带，支持IPv6）
    const proxyData=await getUserIp();
    let province=cleanAmapField(proxyData.province||'');
    let city=cleanAmapField(proxyData.city||'');
    let adcode=cleanAmapField(proxyData.postalCode||'');
    // 如果代理没有返回省/市，再调用高德作为备选
    if(!province||!city){
      try{
        const res=await fetch('https://restapi.amap.com/v3/ip?key='+AMAP_KEY);
        const amapData=await res.json();
        console.log('[登录日志] 实时获取 - 代理省/市为空，调用高德备选，返回：',amapData);
        if(amapData){
          province=province||cleanAmapField(amapData.province||'');
          city=city||cleanAmapField(amapData.city||'');
          adcode=adcode||cleanAmapField(amapData.adcode||'');
        }
      }catch(e){}
    }
    cachedIpInfo={
      ip:proxyData.ip||'',
      province:province,
      city:city,
      adcode:adcode,
      rectangle:''
    };
    return cachedIpInfo;
  }catch(e){
    console.error('[登录日志] 获取IP信息异常：',e);
  }
  return {ip:'',province:'',city:'',adcode:'',rectangle:''};
}

/* 异步记录登录日志 */
async function logLogin(success,userEmail,username,role,groupId,failReason){
  console.log('[登录日志] 开始记录，success=',success,'user=',userEmail);
  try{
    const ipInfo=await getIpInfo();
    console.log('[登录日志] IP信息获取完成，ip=',ipInfo.ip,'province=',ipInfo.province,'city=',ipInfo.city);
    const log={
      user_email:userEmail||'',
      username:username||'',
      role:role||'',
      group_id:groupId||null,
      ip:ipInfo.ip||'',
      province:ipInfo.province||'',
      city:ipInfo.city||'',
      adcode:ipInfo.adcode||'',
      user_agent:navigator.userAgent||'',
      success:!!success,
      fail_reason:failReason||null
    };
    console.log('[登录日志] 准备插入数据库，log=',log);
    // 插入login_logs表，失败重试1次，再失败就放弃
    try{
      const {data,error}=await SB.from('login_logs').insert([log]);
      if(error){
        console.error('[登录日志] 插入失败（第1次）：',error.message);
        try{
          const {data:d2,error:e2}=await SB.from('login_logs').insert([log]);
          if(e2){console.error('[登录日志] 插入失败（第2次）：',e2.message);}
          else{console.log('[登录日志] 插入成功（重试后）');}
        }catch(e2){console.error('[登录日志] 重试异常：',e2);}
      }else{
        console.log('[登录日志] 插入成功！');
      }
    }catch(e){
      console.error('[登录日志] 插入异常：',e);
    }
  }catch(e){
    console.error('[登录日志] 整体异常：',e);
  }
}

  '张益铭':'zhangyiming','董子瑜':'dongziyu','梁锡永':'liangxiyong',
  '杨佳诺':'yangjianuo','张儒溪':'zhangruxi','刘亦峻':'liuyijun',
  '冯馨熠':'fengxinyi','黄詩宸':'huangshichen','谭梦瑶':'tanmengyao',
  '张邵宸':'zhangshaochen','李宜锦':'liyijin','刘铠墨':'liukaimo',
  '王沐宇轩':'wangmuyuxuan'
};
function emailOf(name){
  if(name==='admin'||name==='admin2'||name==='teacher')return name+'@jfz.local';
  return (LEADER_EMAIL[name]||name)+'@jfz.local';
}

/* 判断是否为组长账号（中文姓名），用于密码补0 */
function isLeaderName(name){
  return name!=='admin'&&name!=='admin2'&&name!=='teacher'&&name!=='test';
}

/* ================= 登录逻辑 ================= */
function onLoginNameInput(){
  document.getElementById('loginPwdField').style.display='block';
  document.getElementById('loginErr').textContent='';
}

async function doLogin(){
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;
  btn.textContent='登录中...';
  const redirect=new URLSearchParams(location.search).get('redirect');
  const name0=document.getElementById('loginName').value.trim();
  const nameLower=name0.toLowerCase();
  const name=(nameLower==='admin'||nameLower==='admin2'||nameLower==='teacher'||nameLower==='test')?nameLower:name0;
  let pwd=document.getElementById('loginPwd').value;
  const err=document.getElementById('loginErr');

  if(!name){btn.disabled=false;btn.textContent='登 录';err.textContent='请输入用户名';return;}
  if(!pwd){btn.disabled=false;btn.textContent='登 录';err.textContent='请输入密码';return;}
  if(!SB){btn.disabled=false;btn.textContent='登 录';err.textContent='无法连接认证服务，请检查网络后重试';return;}

  /* Turnstile 人机验证检查 */
  if(!turnstileVerified){
    btn.disabled=false;
    btn.textContent='登 录';
    err.textContent='请先完成人机验证';
    return;
  }

  /* 组长密码自动补0到6位：输入"3" → "000003" */
  if(isLeaderName(name)){
    pwd=pwd.padStart(6,'0');
  }

  const email=emailOf(name);

  /* 登录自动重试：网络错误时重试3次 */
  let data=null,error=null;
  for(let retry=0;retry<3;retry++){
    try{
      const res=await SB.auth.signInWithPassword({email,password:pwd});
      data=res.data;
      error=res.error;
      if(!error)break;
      const msg=error.message||'';
      if(msg.includes('fetch')||msg.includes('Failed to fetch')||msg.includes('Network')||msg.includes('network')||msg.includes('timeout')||(error&&error.name==='TypeError')){
        if(retry<2){
          err.textContent='网络不好，正在重试('+(retry+1)+'/2)...';
          await new Promise(r=>setTimeout(r,1000));
          continue;
        }
      }
      break;
    }catch(e){
      error={message:e.message};
      if(retry<2){
        err.textContent='网络不好，正在重试('+(retry+1)+'/2)...';
        await new Promise(r=>setTimeout(r,1000));
        continue;
      }
    }
  }

  if(error||!data.user){
    btn.disabled=false;btn.textContent='登 录';
    const errMsg=error?error.message||'':'';
    const isNetworkErr=errMsg.includes('fetch')||errMsg.includes('Failed to fetch')||errMsg.includes('Network')||errMsg.includes('network')||errMsg.includes('timeout')||errMsg.includes('Timeout')||(error&&error.name==='TypeError');
    let failReason='';
    if(isNetworkErr){
      err.textContent='网络连接失败，请检查网络或切换WiFi后重试';
      failReason='网络连接失败';
    }else if(errMsg.includes('Invalid')||errMsg.includes('invalid')||errMsg.includes('credentials')||errMsg.includes('password')||errMsg.includes('Email')){
      err.textContent='用户名或密码错误，请重试或联系管理员重置';
      failReason='用户名或密码错误';
    }else{
      err.textContent='登录失败：'+(errMsg||'未知错误');
      failReason=errMsg||'未知错误';
    }
    /* 异步记录登录失败日志 */
    logLogin(false,email,name,null,null,failReason);
    return;
  }

  /* 登录成功后轮询等待session就绪（手机端跨境网络慢，固定500ms不够） */
  for(let waitI=0;waitI<10;waitI++){
    try{
      const {data:sdata}=await SB.auth.getSession();
      if(sdata&&sdata.session&&sdata.session.access_token)break;
    }catch(e){}
    await new Promise(r=>setTimeout(r,500));
  }

  /* 从 users 表读取权威角色和组号，重试4次，每次前刷新session */
  let role='user',gid=null,displayName=name;
  let roleFetchOk=false,roleFetchErr='';
  for(let roleRetry=0;roleRetry<6 && !roleFetchOk;roleRetry++){
    try{
      if(roleRetry>0){try{await SB.auth.getSession();}catch(e){}}
      const loginEmail=data.user.email||email;
      const {data:rrows,error:rerr}=await SB.from('users').select('username,role,group_id').eq('email',loginEmail);
      if(rerr)throw new Error((rerr.code?rerr.code+': ':'')+(rerr.message||'query failed'));
      if(rrows&&rrows.length){role=rrows[0].role||'user';gid=rrows[0].group_id||null;if(rrows[0].username)displayName=rrows[0].username;}
      roleFetchOk=true;
    }catch(e){
      roleFetchErr=e.message||'';
      if(roleRetry<5){await new Promise(r=>setTimeout(r,[500,800,1200,1500,2000][roleRetry]));}
    }
  }
  if(!roleFetchOk){
    try{
      const meta=data.user.user_metadata||{};
      if(meta.role)role=meta.role;
      if(meta.group_id)gid=meta.group_id;
    }catch(e){}
  }
  if(role==='user'){
    btn.disabled=false;btn.textContent='登 录';
    let failReason='该账号无权限';
    if(roleFetchOk){
      err.textContent='该账号无权限，请联系管理员';
    }else if(roleFetchErr.includes('42501')||roleFetchErr.includes('permission')||roleFetchErr.includes('Permission')){
      err.textContent='数据库权限不足，请在Supabase启用users表RLS并授权';
      failReason='数据库权限不足';
    }else if(roleFetchErr.includes('401')||roleFetchErr.includes('403')||roleFetchErr.includes('JWT')||roleFetchErr.includes('jwt')){
      err.textContent='认证令牌无效，请重新登录';
      failReason='认证令牌无效';
    }else{
      err.textContent='获取用户信息失败：'+(roleFetchErr||'未知错误');
      failReason='获取用户信息失败：'+(roleFetchErr||'未知错误');
    }
    /* 异步记录登录失败日志（无权限） */
    logLogin(false,data.user.email||email,displayName,role,gid,failReason);
    await SB.auth.signOut();return;
  }

  /* 保存会话 */
  localStorage.setItem(SESSION_KEY,JSON.stringify({name:displayName,role,groupId:gid||undefined}));

  /* 记录登录成功日志（等待完成后再跳转，避免跳转取消请求） */
  await logLogin(true,data.user.email||email,displayName,role,gid,null);

  /* 记住我 */
  const rm=document.getElementById('rememberMe');
  if(rm&&rm.checked){
    try{localStorage.setItem('jfz_remember_me',LZString.compressToBase64(JSON.stringify({name:name0,pwd:document.getElementById('loginPwd').value})));}catch(e){}
  }else{
    try{localStorage.removeItem('jfz_remember_me');}catch(e){}
  }

  /* 按角色跳转 */
  if(role==='teacher'||role==='leader'){
    location.href=redirect||'group.html';
    return;
  }
  if(role==='admin'||role==='admin2'){
    if(redirect){location.href=redirect;return;}
    document.getElementById('chooseName').textContent=name;
    document.getElementById('loginFields').style.display='none';
    document.getElementById('chooseBox').style.display='block';
    if(role==='admin'){
      document.getElementById('chooseNoticeBtn').style.display='flex';
    }
    if(role==='admin'||role==='admin2'){
      document.getElementById('chooseClassV2Btn').style.display='flex';
    }
    return;
  }
  if(!gid){err.textContent='该账号无权限，请联系管理员';await SB.auth.signOut();localStorage.removeItem(SESSION_KEY);return;}
  location.href=redirect||'group.html';
}

function go(page){location.href=page;}
function backToLogin(){
  document.getElementById('chooseBox').style.display='none';
  document.getElementById('loginFields').style.display='block';
  document.getElementById('loginPwd').value='';
  document.getElementById('loginName').value='';
  document.getElementById('loginErr').textContent='';
}

/* 页面显示时恢复表单状态 */
window.addEventListener('pageshow',function(){
  document.getElementById('loginFields').style.display='block';
  document.getElementById('chooseBox').style.display='none';
  document.getElementById('loginErr').textContent='';
  try{
    const raw=localStorage.getItem('jfz_remember_me');
    if(raw){
      const cred=JSON.parse(LZString.decompressFromBase64(raw));
      if(cred&&cred.name&&cred.pwd){
        document.getElementById('loginName').value=cred.name;
        document.getElementById('loginPwd').value=cred.pwd;
        document.getElementById('rememberMe').checked=true;
        return;
      }
    }
  }catch(e){}
  document.getElementById('loginPwd').value='';
  document.getElementById('loginName').value='';
  document.getElementById('rememberMe').checked=false;
});
</script>
