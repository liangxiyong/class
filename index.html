<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国庆快乐 - 系统维护中</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:#f5f5f5;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
}
.box{
  background:#fff;border-radius:12px;padding:40px 30px;
  width:100%;max-width:400px;text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}
.flag{
  width:100px;height:67px;margin:0 auto 20px;
  background:#DE2910;border-radius:4px;
  position:relative;overflow:hidden;
}
.flag .big{position:absolute;top:10px;left:12px;color:#FFDE00;font-size:24px}
.flag .s{position:absolute;color:#FFDE00;font-size:10px}
.flag .s1{top:5px;left:38px}
.flag .s2{top:13px;left:44px}
.flag .s3{top:23px;left:42px}
.flag .s4{top:31px;left:36px}
h1{font-size:24px;color:#333;margin-bottom:8px}
p{font-size:14px;color:#666;line-height:1.8;margin-bottom:6px}
.date{color:#c0392b;font-weight:bold}
</style>
</head>
<body>
<div class="box">
  <div class="flag">
    <span class="big">★</span>
    <span class="s s1">★</span>
    <span class="s s2">★</span>
    <span class="s s3">★</span>
    <span class="s s4">★</span>
  </div>
  <h1>国庆快乐</h1>
  <p>系统维护中，维护至 <span class="date">10月4日</span></p>
  <p>维护期间暂停登录，敬请谅解。</p>
</div>
</body>
</html>
