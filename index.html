<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班级积分管理系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<style>
:root{
  --paper:#f6f1e8;
  --card:#fffdf9;
  --ink:#2b2420;
  --ink-soft:#7a6d61;
  --line:#e3d9c9;
  --accent:#c0392b;
  --accent-soft:#f6e3df;
  --green:#2e7d32;
  --red:#c62828;
  --font-display:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-body:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font-body);color:var(--ink);
  background:var(--paper);
  background-image:
    radial-gradient(1200px 600px at 85% -10%, rgba(192,57,43,.05), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(46,125,50,.04), transparent 60%);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;color:inherit}
.login-overlay{
  position:fixed;inset:0;background:linear-gradient(160deg,#f6f0e4,#efe5d2);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.login-box{
  background:var(--card);border-radius:20px;padding:34px 30px;width:100%;max-width:380px;
  box-shadow:0 24px 70px rgba(43,36,32,.22);text-align:center;
  animation:pop .25s ease;
}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.login-mark{
  width:58px;height:58px;border-radius:16px;background:var(--accent);color:#fff;
  font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;box-shadow:0 8px 20px rgba(192,57,43,.35);
}
.login-title{font-size:20px;font-weight:800;color:var(--ink);margin-bottom:4px}
.login-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:22px}
.login-field{text-align:left;margin-bottom:14px}
.login-field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:600}
.login-field input{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  font-size:14px;outline:none;background:var(--paper);transition:border .15s;
}
.login-field input:focus{border-color:var(--accent)}
.login-btn{
  width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;transition:all .15s;
}
.login-btn:hover{filter:brightness(1.05)}
.login-err{font-size:12px;color:var(--red);margin-top:10px;min-height:16px}
.login-tip{font-size:11.5px;color:var(--ink-soft);margin-top:14px;line-height:1.7}
.choose-box{display:none;margin-top:4px}
.choose-btn{
  width:100%;padding:15px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--paper);font-size:15px;font-weight:700;color:var(--ink);
  margin-bottom:12px;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:10px;
}
.choose-btn:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.choose-btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;background:var(--paper)}
.choose-btn:disabled:hover{border-color:var(--line);background:var(--paper)}
.choose-btn .ico{font-size:20px}
.choose-back{font-size:12px;color:var(--ink-soft);cursor:pointer;margin-top:6px}
.choose-back:hover{color:var(--accent)}
.role-tag{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);
  background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin-bottom:18px;
}
.role-tag b{color:var(--accent)}

/* ================= 响应式适配 ================= */
@media(max-width:480px){
  .login-overlay{padding:14px}
  .login-box{padding:24px 18px;border-radius:16px}
  .login-title{font-size:17px}
  .login-mark{width:44px;height:44px;font-size:21px;border-radius:12px}
  .choose-btn{padding:12px;font-size:14px}
}
</style>
</head>
<body>

<div class="login-overlay">
  <div class="login-box">
    <div class="login-mark">积</div>
    <div class="login-title">班级积分管理系统</div>

    <div id="loginFields">
      <div class="login-field">
        <label>用户名</label>
        <input type="text" id="loginName" placeholder="输入用户名" autocomplete="username" oninput="onLoginNameInput()" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="login-field" id="loginPwdField">
        <label>密码</label>
        <input type="password" id="loginPwd" placeholder="输入密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="login-btn" onclick="doLogin()">登 录</button>
      <div class="login-err" id="loginErr"></div>
    </div>

    <div class="choose-box" id="chooseBox">
      <div class="role-tag">已登录：<b id="chooseName"></b>（<span id="chooseRole">管理员</span>）</div>
      <button class="choose-btn" id="chooseBtnG" onclick="go('group.html')"><span class="ico">📊</span>小组积分</button>
      <button class="choose-btn" id="chooseClassBtn" onclick="go('class.html')"><span class="ico">🏫</span>班级管理</button>
      <div class="choose-back" onclick="backToLogin()">← 返回重新登录</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const SESSION_KEY='jfz_session_v1';
const SUPABASE_URL='https://zaeijgfuykhkabteqljw.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphZWlqZ2Z1eWtoa2FidGVxbGp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1ODA5MzgsImV4cCI6MjEwNDE1NjkzOH0.CQ-jqsslzaWpeeXg0OJnQsaW-iMNoCKbJGW_-p1F3D8';
const SB=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
/* 组长姓名 → 登录邮箱（拼音），与 SQL 种子一致 */
const LEADER_EMAIL={'张益铭':'zhangyiming','董子瑜':'dongziyu','梁锡永':'liangxiyong','杨佳诺':'yangjianuo','马语秋':'mayuqiu','刘亦峻':'liuyijun','冯馨熠':'fengxinyi','黄詩宸':'huangshichen','谭梦瑶':'tanmengyao','张邵宸':'zhangshaochen'};
function emailOf(name){
  if(name==='admin'||name==='admin2'||name==='teacher')return name+'@jfz.local';
  return (LEADER_EMAIL[name]||name)+'@jfz.local';
}
const GROUP_NAMES={'1':'第一组','2':'第二组','3':'第三组','4':'第四组','5':'第五组','6':'第六组','7':'第七组','8':'第八组','9':'第九组','10':'第十组'};
const LEADER_GROUP={'张益铭':'1','董子瑜':'2','梁锡永':'3','杨佳诺':'4','马语秋':'5','刘亦峻':'6','冯馨熠':'7','黄詩宸':'8','谭梦瑶':'9','张邵宸':'10'};
let groupLeaders=[];
function leaderGroupOf(name){
  const l=groupLeaders.find(x=>x.name===name);
  if(l)return l.group_id;
  return LEADER_GROUP[name]||null;
}

function onLoginNameInput(){
  document.getElementById('loginPwdField').style.display='block';
  document.getElementById('loginErr').textContent='';
}
async function doLogin(){
  const name0=document.getElementById('loginName').value.trim();
  const name=name0.toLowerCase()==='teacher'?'teacher':name0;
  const pwd=document.getElementById('loginPwd').value;
  const err=document.getElementById('loginErr');
  if(!name){err.textContent='请输入用户名';return;}
  if(!pwd){err.textContent='请输入密码';return;}
  if(!SB){err.textContent='无法连接认证服务，请检查网络后重试';return;}
  const email=emailOf(name);
  const {data,error}=await SB.auth.signInWithPassword({email,password:pwd});
  if(error||!data.user){
    err.textContent='用户名或密码错误，请重试或联系管理员重置';
    return;
  }
  const meta=(data.user.user_metadata)||{};
  const role=meta.role||'user';
  const gid=meta.group_id||null;
  if(role==='user'){err.textContent='该账号无权限，请联系管理员';await SB.auth.signOut();return;}
  localStorage.setItem(SESSION_KEY,JSON.stringify({name,role,groupId:gid||undefined}));
  if(role==='admin2'){
    const chk=await checkAdmin2Enabled(data.session.access_token);
    // 禁用仅影响班级管理：admin2 仍可登录、仍可进小组积分，只是班级管理入口置灰
    localStorage.setItem('jfz_admin2_class_enabled',(!chk.ok||chk.enabled)?'1':'0');
    document.getElementById('chooseName').textContent=name;
    document.getElementById('chooseRole').textContent='管理员';
    document.getElementById('loginFields').style.display='none';
    document.getElementById('chooseBox').style.display='block';
    const cb=document.getElementById('chooseClassBtn');
    if(cb)cb.disabled=localStorage.getItem('jfz_admin2_class_enabled')==='0';
    return;
  }
  if(role==='admin'||role==='teacher'){
    document.getElementById('chooseName').textContent=name;
    document.getElementById('chooseRole').textContent=role==='admin'?'管理员':'老师';
    document.getElementById('loginFields').style.display='none';
    document.getElementById('chooseBox').style.display='block';
    return;
  }
  if(!gid){err.textContent='该账号无权限，请联系管理员';await SB.auth.signOut();localStorage.removeItem(SESSION_KEY);return;}
  location.href='group.html';
}
async function checkAdmin2Enabled(token){
  try{
    const resp=await fetch(SUPABASE_URL+'/rest/v1/class_data?id=eq.class&select=data',{headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+token}});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const rows=await resp.json();
    const remote=rows&&rows.length?rows[0].data:null;
    return{ok:true,enabled:remote?remote.admin2Enabled!==false:true};
  }catch(e){
    return{ok:false,enabled:false};
  }
}
function go(page){location.href=page;}
function backToLogin(){
  document.getElementById('chooseBox').style.display='none';
  document.getElementById('loginFields').style.display='block';
  document.getElementById('loginPwd').value='';
  document.getElementById('loginPwdField').style.display='block';
  document.getElementById('loginName').value='';
  document.getElementById('loginErr').textContent='';
}
window.addEventListener('pageshow',function(){
  document.getElementById('loginFields').style.display='block';
  document.getElementById('chooseBox').style.display='none';
  const cb=document.getElementById('chooseClassBtn');
  if(cb)cb.disabled=false;
  document.getElementById('loginPwd').value='';
  document.getElementById('loginPwdField').style.display='block';
  document.getElementById('loginName').value='';
  document.getElementById('loginErr').textContent='';
});
</script>
</body>
</html>
