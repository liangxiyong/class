<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班级积分管理系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<style>
:root{
  --paper:#1a0a0a;
  --card:#2a1010;
  --ink:#f5e6c8;
  --ink-soft:#c9a96e;
  --line:#8b6914;
  --accent:#c9a227;
  --accent-soft:#3d2800;
  --green:#4caf50;
  --red:#e53935;
  --font-song:"SimSun","Songti SC","STSong","Noto Serif SC",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font-song);color:var(--ink);
  background:var(--paper);
  background-image:
    radial-gradient(1200px 600px at 85% -10%, rgba(201,162,39,.12), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(180,30,30,.15), transparent 60%),
    linear-gradient(160deg,#1a0505 0%,#2d0a0a 50%,#1a0505 100%);
  -webkit-font-smoothing:antialiased;
}
button{font-family:var(--font-song);cursor:pointer;border:none;background:none;color:inherit}
input{font-family:var(--font-song);color:inherit}
.login-overlay{
  position:fixed;inset:0;
  background:linear-gradient(160deg,#1a0505 0%,#2d0a0a 50%,#1a0505 100%);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.login-box{
  background:var(--card);border:2px solid var(--accent);border-radius:20px;padding:34px 30px;width:100%;max-width:380px;
  box-shadow:0 0 40px rgba(201,162,39,.25),0 24px 70px rgba(0,0,0,.5);text-align:center;
  animation:pop .25s ease;
}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.login-mark{
  width:58px;height:58px;border-radius:16px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;box-shadow:0 8px 20px rgba(192,57,43,.35);
}
.login-mark img{width:100%;height:100%;object-fit:cover;display:block}
.login-title{font-size:20px;font-weight:700;color:var(--accent);margin-bottom:4px;letter-spacing:2px}
.login-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:22px}
.login-field{text-align:left;margin-bottom:14px}
.login-field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:400}
.login-field input{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  font-size:14px;outline:none;background:#1a0808;color:var(--ink);transition:border .15s;
}
.login-field input:focus{border-color:var(--accent)}
.login-btn{
  width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#c9a227,#e8c84a);color:#1a0505;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;transition:all .15s;letter-spacing:4px;
}
.login-btn:hover{filter:brightness(1.05)}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
.login-err{font-size:12px;color:var(--red);margin-top:10px;min-height:16px}
.login-tip{font-size:11.5px;color:var(--ink-soft);margin-top:14px;line-height:1.7}
.choose-box{display:none;margin-top:4px}
.choose-btn{
  width:100%;padding:15px;border-radius:12px;border:1.5px solid var(--line);
  background:#1a0808;font-size:15px;font-weight:400;color:var(--ink);
  margin-bottom:12px;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:10px;
}
.choose-btn:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.choose-btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;background:#1a0808}
.choose-btn .ico{font-size:20px}
.choose-back{font-size:12px;color:var(--ink-soft);cursor:pointer;margin-top:6px}
.choose-back:hover{color:var(--accent)}
.role-tag{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);
  background:#1a0808;border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin-bottom:18px;
}
.role-tag b{color:var(--accent)}
.login-remember{margin:4px 0 10px;font-size:13px;color:#6b5e4a;display:flex;align-items:center;gap:6px}
.login-remember input{width:16px;height:16px;cursor:pointer}
.login-remember label{cursor:pointer;display:flex;align-items:center;gap:6px}
.tip-box{
  font-size:12px;color:var(--ink-soft);line-height:1.7;margin-top:14px;padding:10px 12px;
  background:rgba(201,162,39,.08);border:1px solid rgba(201,162,39,.2);border-radius:8px;text-align:left;
}
.tip-box .tip-title{font-weight:600;margin-bottom:4px;color:var(--accent)}

@media(max-width:480px){
  .login-overlay{padding:14px}
  .login-box{padding:24px 18px;border-radius:16px}
  .login-title{font-size:17px}
  .login-mark{width:44px;height:44px;font-size:21px;border-radius:12px}
  .choose-btn{padding:12px;font-size:14px}
  .login-field input{min-height:44px;font-size:15px}
  .login-btn{min-height:46px;font-size:15px}
  .choose-btn{min-height:46px}
}
</style>
</head>

/* ================= 配置（双节点：首尔主 + 新加坡备） ================= */
const SESSION_KEY='jfz_session_v1';
const NODE_SEOUL={name:'seoul',url:'https://olalgnwkszacavgcqhov.supabase.co',key:'sb_publishable_B5VRNPT7oJaoX-x6IeprIg_bb5LZCJX'};
const NODE_SG={name:'singapore',url:'https://zaeijgfuykhkabteqljw.supabase.co',key:'sb_publishable_0jO8jlE97WIbfcuntZv8EQ_uaxFXDfr'};

function makeClient(node){
  return window.supabase?window.supabase.createClient(node.url,node.key,{
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true},
    realtime:{
      reconnectAfterMs:function(tries){
        var backoff=[5000,8000,12000,20000,30000];
        return backoff[Math.min(tries-1,backoff.length-1)];
      },
      timeout:15000,
      heartbeatIntervalMs:8000
    }
  }):null;
}

const SB_SEOUL=makeClient(NODE_SEOUL);
const SB_SG=makeClient(NODE_SG);
/* 当前激活的客户端，登录成功后指向成功的节点 */
let SB=SB_SEOUL;
let activeNode=NODE_SEOUL;

/* ================= 组长姓名 → 拼音邮箱 ================= */
const LEADER_EMAIL={
  '张益铭':'zhangyiming','董子瑜':'dongziyu','梁锡永':'liangxiyong',
  '杨佳诺':'yangjianuo','张儒溪':'zhangruxi','刘亦峻':'liuyijun',
  '冯馨熠':'fengxinyi','黄詩宸':'huangshichen','谭梦瑶':'tanmengyao',
  '张邵宸':'zhangshaochen','李宜锦':'liyijin','刘铠墨':'liukaimo',
  '王沐宇轩':'wangmuyuxuan'
};
function emailOf(name){
  if(name==='admin'||name==='admin2'||name==='teacher')return name+'@jfz.local';
  return (LEADER_EMAIL[name]||name)+'@jfz.local';
}

/* 判断是否为组长账号（中文姓名），用于密码补0 */
function isLeaderName(name){
  return name!=='admin'&&name!=='admin2'&&name!=='teacher'&&name!=='test';
}

/* ================= 登录逻辑 ================= */
function onLoginNameInput(){
  document.getElementById('loginPwdField').style.display='block';
  document.getElementById('loginErr').textContent='';
}

async function doLogin(){
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;
  btn.textContent='登录中...';
  const redirect=new URLSearchParams(location.search).get('redirect');
  const name0=document.getElementById('loginName').value.trim();
  const nameLower=name0.toLowerCase();
  const name=(nameLower==='admin'||nameLower==='admin2'||nameLower==='teacher'||nameLower==='test')?nameLower:name0;
  let pwd=document.getElementById('loginPwd').value;
  const err=document.getElementById('loginErr');

  if(!name){btn.disabled=false;btn.textContent='登 录';err.textContent='请输入用户名';return;}
  if(!pwd){btn.disabled=false;btn.textContent='登 录';err.textContent='请输入密码';return;}
  if(!SB){btn.disabled=false;btn.textContent='登 录';err.textContent='无法连接认证服务，请检查网络后重试';return;}

  /* 组长密码自动补0到6位：输入"3" → "000003" */
  if(isLeaderName(name)){
    pwd=pwd.padStart(6,'0');
  }

  const email=emailOf(name);

  /* 串行双节点：先试首尔，首尔网络错误才兜底新加坡 */
  function isNetErr(e){
    const m=(e&&e.message)||'';
    return m.includes('fetch')||m.includes('Failed to fetch')||m.includes('Network')||m.includes('network')||m.includes('timeout')||m.includes('Timeout')||(e&&e.name==='TypeError');
  }
  async function loginSerial(email,pwd){
    /* 先试首尔 */
    try{
      const res=await SB_SEOUL.auth.signInWithPassword({email,password:pwd});
      if(!res.error)return {data:res.data,node:NODE_SEOUL,client:SB_SEOUL};
      /* 账号密码错误直接返回，不试新加坡 */
      if(!isNetErr(res.error))return {error:res.error};
      /* 网络错误，继续试新加坡 */
    }catch(e){
      if(!isNetErr(e))return {error:{message:e.message}};
    }
    /* 首尔网络错误，试新加坡 */
    try{
      const res2=await SB_SG.auth.signInWithPassword({email,password:pwd});
      if(!res2.error)return {data:res2.data,node:NODE_SG,client:SB_SG};
      return {error:res2.error};
    }catch(e2){
      return {error:{message:e2.message}};
    }
  }

  let data=null,error=null;
  const result=await loginSerial(email,pwd);
  if(result.data){
    data=result.data;
    SB=result.client;
    activeNode=result.node;
    try{localStorage.setItem('jfz_active_node',JSON.stringify(activeNode));}catch(e){}
  }else{
    error=result.error;
  }

  if(error||!data.user){
    btn.disabled=false;btn.textContent='登 录';
    const errMsg=error?error.message||'':'';
    const isNetworkErr=errMsg.includes('fetch')||errMsg.includes('Failed to fetch')||errMsg.includes('Network')||errMsg.includes('network')||errMsg.includes('timeout')||errMsg.includes('Timeout')||(error&&error.name==='TypeError');
    if(isNetworkErr){
      err.textContent='网络连接失败，请检查网络或切换WiFi后重试';
    }else if(errMsg.includes('Invalid')||errMsg.includes('invalid')||errMsg.includes('credentials')||errMsg.includes('password')||errMsg.includes('Email')){
      err.textContent='用户名或密码错误，请重试或联系管理员重置';
    }else{
      err.textContent='登录失败：'+(errMsg||'未知错误');
    }
    return;
  }

  /* 登录成功后稍等，确保 token 已写入客户端 */
  await new Promise(r=>setTimeout(r,500));
  try{await SB.auth.getSession();}catch(e){}

  /* 从 users 表读取权威角色和组号，重试4次，每次前刷新session */
  let role='user',gid=null,displayName=name;
  let roleFetchOk=false,roleFetchErr='';
  for(let roleRetry=0;roleRetry<4 && !roleFetchOk;roleRetry++){
    try{
      if(roleRetry>0){try{await SB.auth.getSession();}catch(e){}}
      const loginEmail=data.user.email||email;
      const {data:rrows,error:rerr}=await SB.from('users').select('username,role,group_id').eq('email',loginEmail);
      if(rerr)throw new Error((rerr.code?rerr.code+': ':'')+(rerr.message||'query failed'));
      if(rrows&&rrows.length){role=rrows[0].role||'user';gid=rrows[0].group_id||null;if(rrows[0].username)displayName=rrows[0].username;}
      roleFetchOk=true;
    }catch(e){
      roleFetchErr=e.message||'';
      if(roleRetry<3){await new Promise(r=>setTimeout(r,[500,1000,1500][roleRetry]));}
    }
  }
  if(!roleFetchOk){
    try{
      const meta=data.user.user_metadata||{};
      if(meta.role)role=meta.role;
      if(meta.group_id)gid=meta.group_id;
    }catch(e){}
  }
  if(role==='user'){
    btn.disabled=false;btn.textContent='登 录';
    if(roleFetchOk){
      err.textContent='该账号无权限，请联系管理员';
    }else if(roleFetchErr.includes('42501')||roleFetchErr.includes('permission')||roleFetchErr.includes('Permission')){
      err.textContent='数据库权限不足，请在Supabase启用users表RLS并授权';
    }else if(roleFetchErr.includes('401')||roleFetchErr.includes('403')||roleFetchErr.includes('JWT')||roleFetchErr.includes('jwt')){
      err.textContent='认证令牌无效，请重新登录';
    }else{
      err.textContent='获取用户信息失败：'+(roleFetchErr||'未知错误');
    }
    await SB.auth.signOut();return;
  }

  /* 保存会话 */
  localStorage.setItem(SESSION_KEY,JSON.stringify({name:displayName,role,groupId:gid||undefined}));

  /* 记住我 */
  const rm=document.getElementById('rememberMe');
  if(rm&&rm.checked){
    try{localStorage.setItem('jfz_remember_me',LZString.compressToBase64(JSON.stringify({name:name0,pwd:document.getElementById('loginPwd').value})));}catch(e){}
  }else{
    try{localStorage.removeItem('jfz_remember_me');}catch(e){}
  }

  /* 按角色跳转 */
  if(role==='teacher'||role==='leader'){
    location.href=redirect||'group.html';
    return;
  }
  if(role==='admin'||role==='admin2'){
    if(redirect){location.href=redirect;return;}
    document.getElementById('chooseName').textContent=name;
    document.getElementById('loginFields').style.display='none';
    document.getElementById('chooseBox').style.display='block';
    if(role==='admin'){
      document.getElementById('chooseClassV2Btn').style.display='flex';
      document.getElementById('chooseNoticeBtn').style.display='flex';
    }
    return;
  }
  if(!gid){err.textContent='该账号无权限，请联系管理员';await SB.auth.signOut();localStorage.removeItem(SESSION_KEY);return;}
  location.href=redirect||'group.html';
}

function go(page){location.href=page;}
function backToLogin(){
  document.getElementById('chooseBox').style.display='none';
  document.getElementById('loginFields').style.display='block';
  document.getElementById('loginPwd').value='';
  document.getElementById('loginName').value='';
  document.getElementById('loginErr').textContent='';
}

/* 页面显示时恢复表单状态 */
window.addEventListener('pageshow',function(){
  document.getElementById('loginFields').style.display='block';
  document.getElementById('chooseBox').style.display='none';
  document.getElementById('loginErr').textContent='';
  try{
    const raw=localStorage.getItem('jfz_remember_me');
    if(raw){
      const cred=JSON.parse(LZString.decompressFromBase64(raw));
      if(cred&&cred.name&&cred.pwd){
        document.getElementById('loginName').value=cred.name;
        document.getElementById('loginPwd').value=cred.pwd;
        document.getElementById('rememberMe').checked=true;
        return;
      }
    }
  }catch(e){}
  document.getElementById('loginPwd').value='';
  document.getElementById('loginName').value='';
  document.getElementById('rememberMe').checked=false;
});
</script>
</body>
</html>
